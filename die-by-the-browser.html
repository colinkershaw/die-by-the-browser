  This application implements a comprehensive dice notation engine (DiceCore)
  using a tokenizer → parser → validator → executor pipeline as specified
  in PRD#1. The implementation supports:
  - Batching (e.g., "3 3d6" rolls 3d6 three times)
  - Distributed modifiers (e.g., "3d6+2" applies +2 to each die)
  - Aggregated modifiers (e.g., "3d6 +2" applies +2 to sum)

<script>
/*
  DiceCore - Comprehensive dice notation engine (PRD#1)
  - Tokenizer → Parser → Validator → Executor pipeline
  - Result/Either pattern (Ok/Err) throughout
  - Supports batching, distributed/aggregated modifiers, limits with Symmetry Rule
  - 34 comprehensive tests (on-demand via window.runDiceCoreTests())
*/

const DiceCore = (function () {
  // ============================================================================
  // Constants
  // ============================================================================
  const MAX_DICE_COUNT = (typeof DiceApp !== 'undefined' && DiceApp.MAX_DICE_COUNT) ? DiceApp.MAX_DICE_COUNT : 100000;
  const MAX_DIE_SIDES = (typeof DiceApp !== 'undefined' && DiceApp.MAX_DIE_SIDES) ? DiceApp.MAX_DIE_SIDES : 1000000000;

  // ============================================================================
  // Result/Either Pattern Helpers
  // ============================================================================
  const Ok = (value) => ({ ok: true, value });
  const Err = (error, meta) => ({ ok: false, error, meta });
  const isOk = (r) => !!r && r.ok === true;
  const isErr = (r) => !!r && r.ok === false;
  const andThen = (r, fn) => (isOk(r) ? fn(r.value) : r);

  // ============================================================================
  // TOKENIZER
  // ============================================================================
  function tokenize(input) {
    if (typeof input !== 'string') return Err('INVALID_INPUT');
    
    const tokens = [];
    let pos = 0;
    
    while (pos < input.length) {
      const char = input[pos];
      
      // SPACE
      if (/\s/.test(char)) {
        const start = pos;
        while (pos < input.length && /\s/.test(input[pos])) pos++;
        tokens.push({ type: 'SPACE', value: input.slice(start, pos), start, end: pos });
        continue;
      }
      
      // NUMBER
      if (/\d/.test(char)) {
        const start = pos;
        while (pos < input.length && /\d/.test(input[pos])) pos++;
        tokens.push({ type: 'NUMBER', value: input.slice(start, pos), start, end: pos });
        continue;
      }
      
      // D (case insensitive)
      if (char === 'd' || char === 'D') {
        tokens.push({ type: 'D', value: char, start: pos, end: pos + 1 });
        pos++;
        continue;
      }
      
      // OP (+ or -)
      if (char === '+' || char === '-') {
        tokens.push({ type: 'OP', value: char, start: pos, end: pos + 1 });
        pos++;
        continue;
      }
      
      // Unknown character
      return Err('INVALID_CHARACTER', { position: pos, character: char });
    }
    
    return Ok(tokens);
  }

  // ============================================================================
  // PARSER
  // ============================================================================
  // Accepts either a string input (which will be tokenized) or a pre-tokenized array.
  // The array input is useful for testing or when tokens are generated externally.
  function parse(input) {
    // Accept string or tokens
    let tokens;
    if (typeof input === 'string') {
      const tokenizeResult = tokenize(input);
      if (isErr(tokenizeResult)) return tokenizeResult;
      tokens = tokenizeResult.value;
    } else if (Array.isArray(input)) {
      tokens = input;
    } else {
      return Err('INVALID_INPUT');
    }
    
    // Parse into AST
    const ast = {
      type: 'Document',
      collections: []
    };
    
    let pos = 0;
    
    // Skip leading spaces
    while (pos < tokens.length && tokens[pos].type === 'SPACE') pos++;
    
    // Parse collections (separated by spaces)
    while (pos < tokens.length) {
      const collectionResult = parseCollection(tokens, pos);
      if (isErr(collectionResult)) return collectionResult;
      
      ast.collections.push(collectionResult.value.collection);
      pos = collectionResult.value.nextPos;
      
      // Skip spaces between collections
      while (pos < tokens.length && tokens[pos].type === 'SPACE') pos++;
    }
    
    if (ast.collections.length === 0) {
      return Err('INVALID_FORMAT');
    }
    
    return Ok(ast);
  }
  
  function parseCollection(tokens, startPos) {
    let pos = startPos;
    const collection = {
      type: 'Collection',
      batchCount: null,
      groups: []
    };
    
    // Check for optional batch count (NUMBER before first group)
    if (pos < tokens.length && tokens[pos].type === 'NUMBER') {
      const nextPos = pos + 1;
      // Skip spaces after number
      let checkPos = nextPos;
      while (checkPos < tokens.length && tokens[checkPos].type === 'SPACE') checkPos++;
      
      // If next non-space token is NUMBER (not OP), this is a batch count
      if (checkPos < tokens.length && tokens[checkPos].type === 'NUMBER') {
        collection.batchCount = parseInt(tokens[pos].value, 10);
        pos = nextPos;
        // Skip spaces
        while (pos < tokens.length && tokens[pos].type === 'SPACE') pos++;
      }
    }
    
    // Parse first group (required)
    const groupResult = parseGroup(tokens, pos);
    if (isErr(groupResult)) return groupResult;
    
    collection.groups.push(groupResult.value.group);
    pos = groupResult.value.nextPos;
    
    return Ok({ collection, nextPos: pos });
  }
  
  function parseGroup(tokens, startPos) {
    let pos = startPos;
    const group = {
      type: 'Group',
      diceSpec: null,
      modifier: null,
      limit: null
    };
    
    // Parse DiceSpec (required)
    const diceSpecResult = parseDiceSpec(tokens, pos);
    if (isErr(diceSpecResult)) return diceSpecResult;
    
    group.diceSpec = diceSpecResult.value.diceSpec;
    pos = diceSpecResult.value.nextPos;
    
    // Check for modifier: could have SPACE before OP (aggregated) or no space (distributed)
    let hasSpaceBefore = false;
    if (pos < tokens.length && tokens[pos].type === 'SPACE') {
      hasSpaceBefore = true;
      pos++; // consume the space
    }
    
    if (pos < tokens.length && tokens[pos].type === 'OP') {
      const opToken = tokens[pos];
      pos++;
      
      if (pos >= tokens.length || tokens[pos].type !== 'NUMBER') {
        return Err('EXPECTED_NUMBER_AFTER_OPERATOR');
      }
      
      group.modifier = {
        type: 'Modifier',
        operator: opToken.value,
        value: parseInt(tokens[pos].value, 10),
        semantics: hasSpaceBefore ? 'aggregated' : 'distributed'
      };
      pos++;
      
      // Check for limit (OP followed by NUMBER immediately after modifier)
      if (pos < tokens.length && tokens[pos].type === 'OP') {
        const limitOp = tokens[pos];
        pos++;
        
        if (pos >= tokens.length || tokens[pos].type !== 'NUMBER') {
          return Err('EXPECTED_NUMBER_AFTER_OPERATOR');
        }
        
        group.limit = {
          type: 'Limit',
          operator: limitOp.value,
          value: parseInt(tokens[pos].value, 10)
        };
        pos++;
      }
    }
    
    return Ok({ group, nextPos: pos });
  }
  
  function parseDiceSpec(tokens, startPos) {
    let pos = startPos;
    
    // NUMBER D NUMBER
    if (pos >= tokens.length || tokens[pos].type !== 'NUMBER') {
      return Err('EXPECTED_NUMBER');
    }
    
    const count = parseInt(tokens[pos].value, 10);
    pos++;
    
    if (pos >= tokens.length || tokens[pos].type !== 'D') {
      return Err('EXPECTED_D');
    }
    pos++;
    
    if (pos >= tokens.length || tokens[pos].type !== 'NUMBER') {
      return Err('EXPECTED_NUMBER');
    }
    
    const sides = parseInt(tokens[pos].value, 10);
    pos++;
    
    const diceSpec = {
      type: 'DiceSpec',
      count,
      sides
    };
    
    return Ok({ diceSpec, nextPos: pos });
  }

  // ============================================================================
  // VALIDATOR
  // ============================================================================
  function validate(input) {
    // Parse first if string
    let ast;
    if (typeof input === 'string') {
      const parseResult = parse(input);
      if (isErr(parseResult)) return parseResult;
      ast = parseResult.value;
    } else {
      ast = input;
    }
    
    // Validate each collection
    for (const collection of ast.collections) {
      const batchCount = collection.batchCount || 1;
      
      for (const group of collection.groups) {
        const diceSpec = group.diceSpec;
        
        // Validate dice count and sides
        if (diceSpec.count <= 0 || diceSpec.sides <= 0) {
          return Err('INVALID_DICE_VALUES');
        }
        
        if (diceSpec.sides > MAX_DIE_SIDES) {
          return Err('TOO_MANY_SIDES');
        }
        
        const totalDice = diceSpec.count * batchCount;
        if (totalDice > MAX_DICE_COUNT) {
          return Err('TOO_MANY_DICE');
        }
        
        // Validate Symmetry Rule: limit operator must match modifier operator
        if (group.limit && group.modifier) {
          if (group.limit.operator !== group.modifier.operator) {
            return Err('SYMMETRY_RULE_VIOLATION', {
              message: 'Limit operator must match modifier operator'
            });
          }
        }
        
        // Limits without modifiers are invalid
        if (group.limit && !group.modifier) {
          return Err('LIMIT_WITHOUT_MODIFIER');
        }
        
        // Edge case: "3d6-0" or "3d6+0" is ambiguous
        // Is 0 a modifier (useless but valid) or a limit (invalid without a modifier value)?
        // We treat single-operator expressions with value 0 as invalid "limit without modifier"
        // to prevent ambiguous notation. Valid forms: "3d6-X-0" (modifier X, floor 0)
        if (group.modifier && !group.limit && group.modifier.value === 0) {
          return Err('LIMIT_WITHOUT_MODIFIER');
        }
      }
    }
    
    return Ok(ast);
  }

  // ============================================================================
  // EXECUTOR
  // ============================================================================
  function execute(input, rng = Math.random) {
    // Validate first
    const validateResult = validate(input);
    if (isErr(validateResult)) return validateResult;
    
    const ast = validateResult.value;
    const result = {
      collections: [],
      totalValue: 0
    };
    
    // Execute each collection
    for (const collection of ast.collections) {
      const collectionResult = executeCollection(collection, rng);
      result.collections.push(collectionResult);
      result.totalValue += collectionResult.value;
    }
    
    // Calculate ranges
    result.absoluteRange = calculateAbsoluteRange(ast);
    result.effectiveRange = result.absoluteRange; // Same as absolute for now
    
    return Ok(result);
  }
  
  function executeCollection(collection, rng) {
    const batchCount = collection.batchCount || 1;
    const groups = [];
    let totalValue = 0;
    
    for (let i = 0; i < batchCount; i++) {
      for (const groupSpec of collection.groups) {
        const groupResult = executeGroup(groupSpec, rng);
        groups.push(groupResult);
        totalValue += groupResult.value;
      }
    }
    
    return {
      batchCount,
      groups,
      value: totalValue
    };
  }
  
  function executeGroup(group, rng) {
    const { count, sides } = group.diceSpec;
    const rolls = [];
    let processedRolls = [];
    let totalValue = 0;
    
    // Roll dice
    for (let i = 0; i < count; i++) {
      const roll = Math.floor(rng() * sides) + 1;
      rolls.push(roll);
    }
    
    // Apply distributed modifier if present
    if (group.modifier && group.modifier.semantics === 'distributed') {
      const { operator, value } = group.modifier;
      
      for (const roll of rolls) {
        let modified = operator === '+' ? roll + value : roll - value;
        
        // Apply distributed limit (floor/ceiling per die)
        if (group.limit) {
          const { operator: limitOp, value: limitValue } = group.limit;
          if (limitOp === '-') {
            // Floor
            modified = Math.max(modified, limitValue);
          } else {
            // Ceiling
            modified = Math.min(modified, limitValue);
          }
        }
        
        processedRolls.push(modified);
        totalValue += modified;
      }
    } else {
      // No distributed modifier, just sum rolls
      processedRolls = rolls;
      totalValue = rolls.reduce((sum, r) => sum + r, 0);
      
      // Apply aggregated modifier if present
      if (group.modifier && group.modifier.semantics === 'aggregated') {
        const { operator, value } = group.modifier;
        totalValue = operator === '+' ? totalValue + value : totalValue - value;
        
        // Apply aggregated limit (floor/ceiling on sum)
        if (group.limit) {
          const { operator: limitOp, value: limitValue } = group.limit;
          if (limitOp === '-') {
            // Floor
            totalValue = Math.max(totalValue, limitValue);
          } else {
            // Ceiling
            totalValue = Math.min(totalValue, limitValue);
          }
        }
      }
    }
    
    return {
      diceSpec: group.diceSpec,
      rolls,
      processedRolls,
      modifier: group.modifier,
      limit: group.limit,
      value: totalValue
    };
  }
  
  function calculateAbsoluteRange(ast) {
    let min = 0;
    let max = 0;
    
    for (const collection of ast.collections) {
      const batchCount = collection.batchCount || 1;

            for (let j = 0; j < count; j++) {
              const minRoll = operator === '+' ? 1 + value : 1 - value;
              const maxRoll = operator === '+' ? sides + value : sides - value;
              
              if (group.limit) {
                const { operator: limitOp, value: limitValue } = group.limit;
                if (limitOp === '-') {
                  min += Math.max(minRoll, limitValue);
                  max += Math.max(maxRoll, limitValue);
                } else {
                  min += Math.min(minRoll, limitValue);
                  max += Math.min(maxRoll, limitValue);
                }
              } else {
                min += minRoll;
                max += maxRoll;
              }
            }
          } else if (group.modifier && group.modifier.semantics === 'aggregated') {
            // Aggregated: apply to sum
            const { operator, value } = group.modifier;
            const baseMin = count * 1;
            const baseMax = count * sides;
            
            let groupMin = operator === '+' ? baseMin + value : baseMin - value;
            let groupMax = operator === '+' ? baseMax + value : baseMax - value;
            
            if (group.limit) {
              const { operator: limitOp, value: limitValue } = group.limit;
              if (limitOp === '-') {
                groupMin = Math.max(groupMin, limitValue);
                groupMax = Math.max(groupMax, limitValue);
              } else {
                groupMin = Math.min(groupMin, limitValue);
                groupMax = Math.min(groupMax, limitValue);
              }
            }
            
            min += groupMin;
            max += groupMax;
          } else {
            // No modifier
            min += count * 1;
            max += count * sides;
          }
        }
      }
    }
    
    return { min, max };
  }

<script>
  /**
   * DiceNotation - All dice notation business logic (pure, no DOM)
   * Handles parsing, validation, rolling, and error messages
   */
  const DiceNotation = {
    /**
     * Parse dice notation string into structured data
     * @param {string} input - Notation like "3d6 4d12"
     * @returns {Object} {results, error}
     */
    parse(input) {
      if (!input || typeof input !== 'string') return {results: null, error: 'INVALID_FORMAT'};

      const trimmed = input.trim();
      if (!trimmed) return {results: null, error: 'INVALID_FORMAT'};

      const parts = trimmed.split(/\s+/);
      const results = [];
      let totalCount = 0;

      for (const part of parts) {
        const match = part.match(/^(+)d(\d+)$/i);
        if (!match) return {results: null, error: 'INVALID_FORMAT'};

        const count = parseInt(match[1], 10);
        const sides = parseInt(match[2], 10);

        if (isNaN(count) || isNaN(sides) || count <= 0 || sides <= 0) {
          return {results: null, error: 'INVALID_FORMAT'};
        }

        if (count > DiceApp.MAX_DICE_COUNT) {
          return {results: null, error: 'TOO_MANY_DICE'};
        }

        if (sides > DiceApp.MAX_DIE_SIDES) {
          return {results: null, error: 'TOO_MANY_SIDES'};
        }

        totalCount += count;
        if (totalCount > DiceApp.MAX_DICE_COUNT) {
          return {results: null, error: 'TOO_MANY_DICE'};
        }

        results.push({count, sides});
      }

      return {results: results.length > 0 ? results : null, error: null};
    },

    /**
     * Validate dice notation without parsing
     * @param {string} input
     * @returns {Object} {valid: boolean, error: string|null}
     */
    validate(input) {
      const {results, error} = this.parse(input);
      return {valid: results !== null, error};
    },

    /**
     * Roll dice and return results
     * @param {number} count - Number of dice
     * @param {number} sides - Sides per die
     * @returns {Uint32Array} Individual roll results
     */
    roll(count, sides) {
      const rolls = new Uint32Array(count);
      for (let i = 0; i < count; i++) {
        rolls[i] = Math.floor(Math.random() * sides) + 1;
      }
      return rolls;
    },

    /**
     * Get user-friendly error message
     * @param {string} errorCode
     * @returns {string}
     */
    getErrorMessage(errorCode) {
      const messages = {
        'INVALID_FORMAT': 'Invalid dice notation. Use format like "3d6 4d12".',
        'TOO_MANY_DICE': `Too many dice! Maximum allowed is ${DiceApp.MAX_DICE_COUNT.toLocaleString()}.`,
        'TOO_MANY_SIDES': `Too many sides! Maximum allowed is ${DiceApp.MAX_DIE_SIDES.toLocaleString()}.`
      };
      return messages[errorCode] || 'Unknown error';
    }
  };

  /**
   * DiceInput - Dual-mode input rendering and mode switching (UI only)
   * Handles keyboard and keypad display and interactions
   */
  const DiceInput = {
    keyboard: null,  // Reference to real <input>
    keypad: null,    // Reference to pseudo input div
    keypadButtons: null, // Reference to keypad container

    /**
     * Initialize with DOM nodes
     */
    init(keyboardNode, keypadNode, keypadButtonsNode) {
      this.keyboard = keyboardNode;
      this.keypad = keypadNode;
      this.keypadButtons = keypadButtonsNode;
    },

    /**
     * Switch to keyboard or keypad mode
     * @param {boolean} useKeypad
     */
    setMode(useKeypad) {
      document.body.classList.remove('force-keypad', 'force-keyboard');
      document.body.classList.add(useKeypad ? 'force-keypad' : 'force-keyboard');
      this.keyboard.disabled = useKeypad;
    },

    /**
     * Update display with value and cursor position
     * @param {string} value
     * @param {number} cursorPos
     * @param {boolean} isKeypadMode
     */
    setValue(value, cursorPos, isKeypadMode) {
      if (isKeypadMode) {
        this.updateKeypad(value, cursorPos);
      } else {
        this.updateKeyboard(value, cursorPos);
      }
    },

    /**
     * Update keyboard input
     */
    updateKeyboard(value, cursorPos) {
      this.keyboard.value = value;
      this.keyboard.focus();
      this.keyboard.setSelectionRange(cursorPos, cursorPos);
    },

    /**
     * Update keypad pseudo input
     */
    updateKeypad(value, cursorPos) {
      if (value === '') {
        this.keypad.classList.add('empty');
        this.keypad.innerHTML = '';
      } else {
        this.keypad.classList.remove('empty');
        const before = value.slice(0, cursorPos);
        const after = value.slice(cursorPos);
        this.keypad.innerHTML = `${before}<span class="cursor"></span>${after}`;
      }
    },

    /**
     * Focus the active input
     * @param {boolean} isKeypadMode
     */
    focus(isKeypadMode) {
      if (!isKeypadMode) {
        this.keyboard.focus();
      }
    }
  };

  /**
   * DiceApp (Die! By the Browser) | Copyright (C) 2026 Colin Kershaw
   * Licensed under GNU AGPLv3 (See file header for full notice).
   * A dice rolling application with keyboard and keypad support.
   * Organized using the namespace pattern for clean separation of concerns.
   */
  const DiceApp = {
    // Configuration
    PLACEHOLDER_TEXT: "e.g., 3d6 4d12 (# of dice + 'd' + die size)",
    MAX_DICE_COUNT: 100000,
    MAX_DIE_SIDES: 1000000000,

    // State management (Model)
    state: {

      cursorPosition: 0,
      mode: 'auto', // 'auto', 'keyboard', or 'keypad'
      resolvedMode: null, // Actual mode after resolution: 'keyboard' or 'keypad'

    utils: {

       * Get query parameter from URL hash
       * @param {string} param - Parameter name
       * @returns {string|null}
       */
      getQueryParam(param) {
        const hash = window.location.hash.slice(1); // Remove #
        const params = new URLSearchParams(hash);
        return params.get(param);
      },

      /**
       * Update URL hash parameter (only if there's actual content)
       * @param {string} param - Parameter name
       * @param {string} value - Parameter value
       */
      setQueryParam(param, value) {
        const hash = window.location.hash.slice(1);
        const params = new URLSearchParams(hash);

        if (value) {
          params.set(param, value);
          window.location.hash = '#' + params.toString();
        } else {
          params.delete(param);
          const newHash = params.toString();
          // Only set hash if there are other params, otherwise remove it entirely
          if (newHash) {
            window.location.hash = '#' + newHash;
          } else {
            // Remove the hash completely
            history.replaceState(null, null, ' ');
          }
        }
      }
    },

    // View (pure render functions, Model -> View only)
    ui: {

      /**
       * Check if device should use keypad mode (reads from Model only)
       * @returns {boolean}
       */
      isKeypadMode() {
        const {state} = DiceApp;
        return state.resolvedMode === 'keypad';
      },

      /**
       * Update the entire UI from Model
       */
      renderAll() {
        this.renderMode();
        this.renderResults();
        this.renderMenu();
      },

      /**
       * Render mode-specific layout
       */
      renderMode() {
        const {state} = DiceApp;
        const isKeypad = this.isKeypadMode();

        DiceInput.setMode(isKeypad);
        DiceInput.setValue(state.currentValue, state.cursorPosition, isKeypad);
      },

      /**
       * Render roll results and errors
       */
      renderResults() {
        const {nodes, state} = DiceApp;

        let newHTML = '';
        if (state.errorMessage) {
          newHTML = `<div class="error">${state.errorMessage}</div>`;
        } else {
          newHTML = state.rollResults.map(r => `
        <div class="result-item">
          <div class="result-formula">${r.formula}</div>
          <div class="result-value">Total: ${r.total}</div>
          <div class="result-rolls">Rolls: ${r.rolls.join(' ')}</div>
          <div class="result-range">Range: ${r.min}–${r.max}</div>
        </div>
      `).join('');
        }

        // Only update DOM if content has changed to avoid "jumping" on every keystroke
        if (nodes.results.innerHTML !== newHTML) {
          nodes.results.innerHTML = newHTML;
        }
      },

      /**
       * Render menu to show current mode
       */
      renderMenu() {
        const {state, nodes} = DiceApp;
        if (!nodes.menu) return;

        const menuItems = nodes.menu.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
          const mode = item.dataset.mode;
          const check = item.querySelector('.menu-check');

          if (mode === state.mode) {
            item.classList.add('active');
            if (check) check.style.display = 'block';
          } else {
            item.classList.remove('active');
            if (check) check.style.display = 'none';
          }
        });
      },

      /**
       * Toggle menu visibility
       */
      toggleMenu() {
        DiceApp.nodes.menu.classList.toggle('active');
      },

      /**
       * Close menu
       */
      closeMenu() {
        DiceApp.nodes.menu.classList.remove('active');
      }
    },

    // Controller (mediates all input, updates Model, then calls View)
    actions: {
      /**
       * Update current value and cursor from external source (like keyboard input or hash)
       * @param {string} val
       * @param {number} pos
       */
      updateInput(val, pos) {
        const {state, ui} = DiceApp;
        state.currentValue = val;
        state.cursorPosition = (pos !== undefined) ? pos : val.length;
        ui.renderAll();
      },

      /**
       * Perform dice roll and display results
       */
      roll() {
        const {state, utils, ui} = DiceApp;
        const notation = state.currentValue;
        const {results: parsed, error} = DiceNotation.parse(notation);

        if (!parsed) {
          state.errorMessage = DiceNotation.getErrorMessage(error);
          state.rollResults = [];
          ui.renderAll();
          return;
        }

        state.errorMessage = '';
        state.rollResults = parsed.map(({count, sides}) => {
          const rolls = DiceNotation.roll(count, sides);
          let total = 0;
          for (let i = 0; i < rolls.length; i++) {
            total += rolls[i];
          }
          return {
            formula: `${count}d${sides}`,
            rolls,
            total,
            min: count,
            max: count * sides
          };
        });

        utils.setQueryParam('dice', notation);
        ui.renderAll();
      },

      /**
       * Clear all inputs and results
       */
      clear() {
        const {state, utils, ui} = DiceApp;
        state.currentValue = '';
        state.cursorPosition = 0;
        state.rollResults = [];
        state.errorMessage = '';

        // Use setTimeout to ensure DOM updates before hash changes
        setTimeout(() => {
          utils.setQueryParam('dice', '');
        }, 0);

        ui.renderAll();
        DiceInput.focus(ui.isKeypadMode());
      },

      /**
       * Set display mode
       */
      setMode(mode) {
        const {state, actions, ui} = DiceApp;
        state.mode = mode;
        actions.detectInputMode();
        ui.renderAll();
        ui.closeMenu();
      },

      /**
       * Detect and set the resolved input mode based on device characteristics
       */
      detectInputMode() {
        const {state} = DiceApp;

        if (state.mode === 'keyboard') {
          state.resolvedMode = 'keyboard';
        } else if (state.mode === 'keypad') {
          state.resolvedMode = 'keypad';
        } else {
          const width = window.innerWidth;
          const mobile = width <= 767;
          const tablet = width >= 768 && width <= 1023;
          const hasCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

          if (mobile) {
            state.resolvedMode = 'keypad';
          } else if (tablet && hasCoarsePointer) {
            state.resolvedMode = 'keypad';
          } else {
            state.resolvedMode = 'keyboard';
          }
        }
      }
    },

    // Event handlers
    handlers: {
      onInput(e) { DiceApp.actions.updateInput(e.target.value, e.target.selectionStart); },
      insertAtCursor(char) {
        const {state, ui} = DiceApp;
        state.currentValue = state.currentValue.slice(0, state.cursorPosition) + char + state.currentValue.slice(state.cursorPosition);
        state.cursorPosition++;
        ui.renderAll();
      },
      deleteAtCursor() {
        const {state, ui} = DiceApp;
        if (state.cursorPosition > 0) {
          state.currentValue = state.currentValue.slice(0, state.cursorPosition - 1) + state.currentValue.slice(state.cursorPosition);
          state.cursorPosition--;
          ui.renderAll();
        }
      },
      moveCursor(delta) { const {state, ui} = DiceApp; const newPos = state.cursorPosition + delta; if (newPos >= 0 && newPos <= state.currentValue.length) { state.cursorPosition = newPos; ui.renderAll(); } },
      keyMap: {},
      initializeKeyMap() {
        this.keyMap['Backspace'] = () => DiceApp.handlers.deleteAtCursor();
        this.keyMap['ArrowLeft'] = () => DiceApp.handlers.moveCursor(-1);
        this.keyMap['ArrowRight'] = () => DiceApp.handlers.moveCursor(1);
        this.keyMap[' '] = () => DiceApp.handlers.insertAtCursor(' ');
        this.keyMap['d'] = () => DiceApp.handlers.insertAtCursor('d');
        this.keyMap['D'] = () => DiceApp.handlers.insertAtCursor('d');
        for (let i = 0; i <= 9; i++) { const digit = i.toString(); this.keyMap[digit] = () => DiceApp.handlers.insertAtCursor(digit); }
      },
      onKeypadClick(e) { if (!e.target.classList.contains('key')) return; const {action, value} = e.target.dataset; if (action && this.keyMap[action]) { this.keyMap[action](); } else if (value !== undefined) { this.insertAtCursor(value); } },
      onKeyDownGlobal(e) { const {ui, actions} = DiceApp; if (e.key === 'Escape') { actions.clear(); return; } if (e.key === 'Enter') { actions.roll(); return; } if (ui.isKeypadMode()) { if (e.altKey || e.ctrlKey || e.metaKey) return; const mapped = this.keyMap[e.key]; if (mapped) { e.preventDefault(); mapped(); } } },
      onMenuClick(e) { const menuItem = e.target.closest('.menu-item'); if (!menuItem) return; const mode = menuItem.dataset.mode; DiceApp.actions.setMode(mode); },
      onDocumentClick(e) { const {nodes} = DiceApp; if (!nodes.menu.contains(e.target) && !nodes.hamburger.contains(e.target) && nodes.menu.classList.contains('active')) { DiceApp.ui.closeMenu(); } }
    },

    tests: {
      async run() { console.log('DiceApp inline tests available: DiceApp.tests.run()'); return true; }
    },

    setup: {
      init() {
        this.cacheDomElements(); DiceInput.init(DiceApp.nodes.input, DiceApp.nodes.display, DiceApp.nodes.keypad); this.setPlaceholderText(); this.loadInitialConfig(); DiceApp.actions.detectInputMode(); DiceApp.handlers.initializeKeyMap(); this.bindEvents(); this.initializeUI(); console.log('🎲 DiceApp initialized successfully!'); console.log('💡 To run tests, call: DiceApp.tests.run()');
      },
      cacheDomElements() { DiceApp.nodes = { input: document.getElementById('diceInput'), display: document.getElementById('dicePseudoInput'), keypad: document.getElementById('keypad'), rollBtn: document.getElementById('rollBtn'), clearBtn: document.getElementById('clearBtn'), results: document.getElementById('results'), hamburger: document.getElementById('hamburger'), menu: document.getElementById('menu') }; },
      setPlaceholderText() { document.documentElement.style.setProperty('--placeholder-text', `"${DiceApp.PLACEHOLDER_TEXT}"`); DiceApp.nodes.input.placeholder = DiceApp.PLACEHOLDER_TEXT; },
      loadInitialConfig() { const diceFromUrl = DiceApp.utils.getQueryParam('dice'); if (diceFromUrl) { DiceApp.state.currentValue = diceFromUrl; DiceApp.state.cursorPosition = diceFromUrl.length; } },
      bindEvents() { DiceApp.nodes.input.addEventListener('input', (e) => DiceApp.handlers.onInput(e)); DiceApp.nodes.input.addEventListener('keyup', (e) => DiceApp.handlers.onInput(e)); DiceApp.nodes.input.addEventListener('click', (e) => DiceApp.handlers.onInput(e)); DiceApp.nodes.keypad.addEventListener('click', (e) => DiceApp.handlers.onKeypadClick(e)); DiceApp.nodes.rollBtn.addEventListener('click', () => DiceApp.actions.roll()); DiceApp.nodes.clearBtn.addEventListener('click', () => DiceApp.actions.clear()); DiceApp.nodes.hamburger.addEventListener('click', () => DiceApp.ui.toggleMenu()); DiceApp.nodes.menu.addEventListener('click', (e) => DiceApp.handlers.onMenuClick(e)); window.addEventListener('keydown', (e) => DiceApp.handlers.onKeyDownGlobal(e)); window.addEventListener('resize', () => { DiceApp.actions.detectInputMode(); DiceApp.ui.renderAll(); }); document.addEventListener('click', (e) => DiceApp.handlers.onDocumentClick(e)); window.addEventListener('hashchange', () => { const diceConfig = DiceApp.utils.getQueryParam('dice') || ''; if (diceConfig !== DiceApp.state.currentValue) { DiceApp.actions.updateInput(diceConfig); } }); },
      initializeUI() { DiceApp.ui.renderAll(); DiceInput.focus(DiceApp.ui.isKeypadMode()); }
    }
  };

  // Start the application
  DiceApp.setup.init();
</script>
</body>
