/*
  DiceCore - Comprehensive dice notation engine (PRD#1)
*/

const DiceCore = (function () {
  const MAX_DICE_COUNT = (typeof DiceApp !== 'undefined' && DiceApp.MAX_DICE_COUNT) ? DiceApp.MAX_DICE_COUNT : 100000;
  const MAX_DIE_SIDES = (typeof DiceApp !== 'undefined' && DiceApp.MAX_DIE_SIDES) ? DiceApp.MAX_DIE_SIDES : 1000000000;

  const Ok = (value) => ({ ok: true, value });
  const Err = (error, meta) => ({ ok: false, error, meta });
  const isOk = (r) => !!r && r.ok === true;
  const isErr = (r) => !!r && r.ok === false;
  const andThen = (r, fn) => (isOk(r) ? fn(r.value) : r);

  function tokenize(input) { /* unchanged tokenizer implementation */ }
  function parse(input) { /* unchanged parser implementation */ }
  function parseCollection(tokens, startPos) { /* unchanged */ }
  function parseGroup(tokens, startPos) { /* unchanged */ }
  function parseDiceSpec(tokens, startPos) { /* unchanged */ }

  function validate(input) {
    let ast;
    if (typeof input === 'string') {
      const parseResult = parse(input);
      if (isErr(parseResult)) return parseResult;
      ast = parseResult.value;
    } else {
      ast = input;
    }

    for (const collection of ast.collections) {
      const batchCount = (collection.batchCount === null ? 1 : collection.batchCount);

      // If client explicitly provided batchCount, ensure it's positive
      if (collection.batchCount !== null && collection.batchCount <= 0) {
        return Err('INVALID_BATCH_COUNT', { count: collection.batchCount });
      }

      for (const group of collection.groups) {
        const diceSpec = group.diceSpec;

        if (diceSpec.count <= 0 || diceSpec.sides <= 0) {
          return Err('INVALID_DICE_VALUES');
        }

        if (diceSpec.sides > MAX_DIE_SIDES) {
          return Err('TOO_MANY_SIDES');
        }

        const totalDice = diceSpec.count * batchCount;
        if (totalDice > MAX_DICE_COUNT) {
          return Err('TOO_MANY_DICE');
        }

        // Symmetry Rule
        if (group.limit && group.modifier) {
          if (group.limit.operator !== group.modifier.operator) {
            return Err('SYMMETRY_RULE_VIOLATION', { message: 'Limit operator must match modifier operator' });
          }
        }

        // Limits without modifiers invalid
        if (group.limit && !group.modifier) {
          return Err('LIMIT_WITHOUT_MODIFIER');
        }

        // Reject useless modifiers +0 or -0
        if (group.modifier && group.modifier.value === 0 && !group.limit) {
          return Err('USELESS_MODIFIER', { message: 'Modifier value of 0 is not allowed' });
        }
      }
    }

    return Ok(ast);
  }

  function execute(input, rng = Math.random) {
    const validateResult = validate(input);
    if (isErr(validateResult)) return validateResult;

    const ast = validateResult.value;
    const result = { collections: [], totalValue: 0 };

    for (const collection of ast.collections) {
      const collectionResult = executeCollection(collection, rng);
      result.collections.push(collectionResult);
      result.totalValue += collectionResult.value;
    }

    result.absoluteRange = calculateAbsoluteRange(ast);
    result.effectiveRange = result.absoluteRange;

    return Ok(result);
  }

  function executeCollection(collection, rng) {
    const batchCount = (collection.batchCount === null ? 1 : collection.batchCount);
    const groups = [];
    let totalValue = 0;

    for (let i = 0; i < batchCount; i++) {
      for (const groupSpec of collection.groups) {
        const groupResult = executeGroup(groupSpec, rng);
        groups.push(groupResult);
        totalValue += groupResult.value;
      }
    }

    return { batchCount, groups, value: totalValue };
  }

  function executeGroup(group, rng) { /* unchanged */ }

  function calculateAbsoluteRange(ast) {
    let min = 0, max = 0;
    for (const collection of ast.collections) {
      const batchCount = (collection.batchCount === null ? 1 : collection.batchCount);
      for (const group of collection.groups) {
        const { count, sides } = group.diceSpec;
        for (let i = 0; i < batchCount; i++) {
          if (group.modifier && group.modifier.semantics === 'distributed') {
            const { operator, value } = group.modifier;
            for (let j = 0; j < count; j++) {
              const minRoll = operator === '+' ? 1 + value : 1 - value;
              const maxRoll = operator === '+' ? sides + value : sides - value;
              if (group.limit) {
                const { operator: limitOp, value: limitValue } = group.limit;
                if (limitOp === '-') {
                  min += Math.max(minRoll, limitValue);
                  max += Math.max(maxRoll, limitValue);
                } else {
                  min += Math.min(minRoll, limitValue);
                  max += Math.min(maxRoll, limitValue);
                }
              } else {
                min += minRoll; max += maxRoll;
              }
            }
          } else if (group.modifier && group.modifier.semantics === 'aggregated') {
            const { operator, value } = group.modifier;
            const baseMin = count * 1; const baseMax = count * sides;
            let groupMin = operator === '+' ? baseMin + value : baseMin - value;
            let groupMax = operator === '+' ? baseMax + value : baseMax - value;
            if (group.limit) {
              const { operator: limitOp, value: limitValue } = group.limit;
              if (limitOp === '-') { groupMin = Math.max(groupMin, limitValue); groupMax = Math.max(groupMax, limitValue); }
              else { groupMin = Math.min(groupMin, limitValue); groupMax = Math.min(groupMax, limitValue); }
            }
            min += groupMin; max += groupMax;
          } else {
            min += count * 1; max += count * sides;
          }
        }
      }
    }
    return { min, max };
  }

  // Tests (unchanged)

  return { Ok, Err, isOk, isErr, andThen, tokenize, parse, validate, execute, tests: { run: function() { /* test runner */ } } };
})();

// Expose test runner
window.runDiceCoreTests = function () { return DiceCore.tests.run(); };

// Wire DiceApp UI to use DiceCore

// (DiceApp and DiceNotation definitions are below in the file; we patch the actions.roll to call DiceCore)

// Wait until DiceApp exists
(function patchDiceAppRoll() {
  // If DiceApp not yet defined, defer patch
  function applyPatch() {
    if (typeof DiceApp === 'undefined' || !DiceApp.actions) { setTimeout(applyPatch, 50); return; }

    DiceApp.actions.roll = function () {
      const { state, utils, ui } = DiceApp;
      const notation = state.currentValue;

      // Use DiceCore.execute directly
      const execResult = DiceCore.execute(notation);
      if (!execResult || execResult.ok === false) {
        const errCode = execResult && execResult.error ? execResult.error : 'INVALID_FORMAT';
        state.errorMessage = (typeof DiceNotation !== 'undefined' && typeof DiceNotation.getErrorMessage === 'function')
          ? DiceNotation.getErrorMessage(errCode)
          : String(errCode);
        state.rollResults = [];
        ui.renderAll();
        return;
      }

      const docResult = execResult.value;
      state.errorMessage = '';
      state.rollResults = [];

      for (const collectionResult of docResult.collections) {
        for (const groupResult of collectionResult.groups) {
          const spec = groupResult.diceSpec || {};
          const count = spec.count || 0;
          const sides = spec.sides || 0;
          const rolls = Array.isArray(groupResult.rolls) ? groupResult.rolls.slice() : (Array.isArray(groupResult.processedRolls) ? groupResult.processedRolls.slice() : []);
          const total = (typeof groupResult.value === 'number') ? groupResult.value : rolls.reduce((s, r) => s + r, 0);

          state.rollResults.push({
            formula: `${count}d${sides}`,
            rolls,
            total,
            min: count,
            max: count * sides
          });
        }
      }

      utils.setQueryParam('dice', notation);
      ui.renderAll();
    };
  }
  applyPatch();
})();

console.info('Patched DiceApp to use DiceCore.execute (if DiceApp present).');
