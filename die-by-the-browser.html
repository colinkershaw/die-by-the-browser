<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--suppress HtmlWrongAttributeValue -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <!--suppress HtmlWrongAttributeValue -->
    <meta http-equiv="Pragma" content="no-cache">
    <!--suppress HtmlWrongAttributeValue -->
    <meta http-equiv="Expires" content="0">
    <title>Die! By the Browser (Dice Rolling App)</title>
    <meta name="theme-color" content="#2AE3F3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico"> <!-- Favicon -->

    <script>
      // Only load manifest if we're not on file://
      if (location.protocol !== 'file:') {
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.json';
        document.head.appendChild(link);
      }

      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      } else if (location.protocol === 'file:') {
        console.info('📱 Manifest and Service Workers unavailable on file:// - deploy to a web server for PWA features');
      }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --placeholder-text: "e.g., 3d6 4d12";
            --mono-font: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas, "Roboto Mono", "Liberation Mono";
            --clamp-floor: #FFFFFF;
            --clamp-ceil:  #FFD166;
            --sort-handle-left-offset: -14px;

            --glow-core:      42, 227, 243;
            --glow-mid:        0, 180, 255;

            --glow2-core:     220, 139, 249;
            --glow2-mid:      213, 142, 249;

            --inner-spread:   6px;
            --inner-opacity:  0.50;
            --outer-spread:   10px;
            --outer-opacity:  0.80;
            --border-opacity: 0.70;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #0B1637;
            color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            padding: 15px;
            position: relative;
        }

        .app-header {
            max-width: 500px;
            position: relative;
            margin: 0 auto 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2AE3F3;
            text-align: center;
            font-size: 1.75em;
            white-space: nowrap;
            flex: 1;
            margin: 0;
        }

        .title-icon {
            width: 2.5em;
            height: 2.5em;
            margin-right: 0.3em;
        }

        .hamburger {
            width: 30px;
            height: 30px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 0;
            border-radius: 6px;
            transition: background 0.3s;
            flex-shrink: 0;
            flex-grow: 0;
            flex-basis: 30px;
            align-self: center;
            margin-top: 0.4em;
        }

        .hamburger:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .hamburger span {
            width: 20px;
            height: 2px;
            background: #2AE3F3;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .menu {
            position: absolute;
            top: 100%;
            right: 0;
            left: auto;
            background: #252d4a;
            color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            padding: 10px;
            min-width: 200px;
            display: none;
            z-index: 1000;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 24px 32px;
            background: rgba(11, 22, 55, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(42, 227, 243, 0.3);
            color: #2AE3F3;
            font-weight: 600;
            font-size: 1.2em;
            z-index: 2000;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(42, 227, 243, 0.3);
            border-top-color: #2AE3F3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /*noinspection CssUnusedSymbol*/
        .menu.active {
            display: block;
        }

        .menu-item {
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /*noinspection CssUnusedSymbol*/
        .menu-item.active {
            background: rgba(42, 227, 243, 0.2);
            color: #2AE3F3;
            font-weight: 600;
        }

        .menu-label {
            font-size: 0.95em;
        }

        .menu-check {
            color: #2AE3F3;
            font-size: 1.2em;
        }

        .menu-separator {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            margin: 8px 6px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        #diceInput,
        #dicePseudoInput {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #2AE3F3;
            border-radius: 10px;
            min-height: 52px;
            background: #0d142d;
            color: #ffffff;
            box-sizing: border-box;
            line-height: 1.4;
            overflow-wrap: break-word;
        }

        #diceInput {
            outline: none;
            font-family: inherit;
            resize: none;
            overflow-y: hidden;
            white-space: pre-wrap;
            box-shadow: 0 0 0 3px rgba(42, 227, 243, 0);
        }

        #dicePseudoInput {
            display: none;
            cursor: text;
            word-wrap: break-word;
        }

        /*noinspection CssUnusedSymbol*/
        #dicePseudoInput.active {
            display: block;
        }

        #dicePseudoInput.empty {
            color: #636e72;
        }

        #dicePseudoInput.empty::before {
            content: var(--placeholder-text);
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #2AE3F3;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        .keypad {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        /*noinspection CssUnusedSymbol*/
        .keypad.active {
            display: grid;
        }

        .key {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            background: #252d4a;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            color: #ffffff;
        }

        .key:hover {
            background: #303b5e;
            transform: scale(1.05);
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.special {
            background: #2AE3F3;
            color: #0d142d;
        }

        .key.special:hover {
            background: #23cbd9;
        }

        .key.delete {
            background: #e74c3c;
            color: white;
        }

        .key.delete:hover {
            background: #c0392b;
        }

        .key.nav {
            background: #4a5568;
            color: white;
        }

        .key.nav:hover {
            background: #2d3748;
        }

        .key.operator {
            background: #4a5568;
            color: #2AE3F3;
        }

        .key.operator:hover {
            background: #2d3748;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .keypad-group {
            width: min(100%, 420px);
            margin: 0 auto;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        #rollBtn {
            background: #2AE3F3;
            color: #0d142d;
        }

        #rollBtn:hover {
            background: #23cbd9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 227, 243, 0.4);
        }

        #rollBtn:disabled {
            background: #252d4a;
            color: #718096;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        #clearBtn {
            background: #252d4a;
            color: #ffffff;
        }

        #clearBtn:hover {
            background: #303b5e;
        }

        .results {
            background: #0d142d;
            border-radius: 10px;
            padding: 5px;
            min-height: 100px;
        }

        .result-item {
            background: #1a2238;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #2AE3F3;
            animation:  slideIn 0.3s ease-out;
            color: #ffffff;
            position: relative;
        }

        .sort-handle {
            position: absolute;
            left: var(--sort-handle-left-offset);
            top: 0;
            bottom: 0;
            width: 18px;
            cursor: pointer;
            border-radius: 8px 0 0 8px;
            z-index: 2;
        }

        .sort-handle:hover {
            background: rgba(42, 227, 243, 0.18);
        }

        .sort-handle[data-sort="desc"],
        .sort-handle[data-sort="asc"] {
            background: rgba(42, 227, 243, 0.10);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result-formula {
            font-weight: 600;
            color: #2AE3F3;
            margin-bottom: 8px;
        }

        /* Grid row: label + value side by side */
        .result-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-top: 5px;
        }

        /* Stacked row: label on top, content below (used for Rolls) */
        .result-row--stacked {
            flex-direction: column;
            align-items: stretch;
        }

        /* Fixed-width label column so values align across all rows */
        .result-lbl {
            color: #a0aec0;
            font-size: 0.78em;
            text-transform: uppercase;
            /*noinspection CssNonIntegerLengthInPixels*/
            letter-spacing: 0.6px;
            min-width: 50px;
            flex-shrink: 0;
        }

        .sort-indicator {
            margin-left: 4px;
            color: #2AE3F3;
            font-size: 0.95em;
            line-height: 1;
            font-weight: 700;
        }

        .result-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #ffffff;
        }

        .result-rolls {
            font-size: 1.2em;
            color: #2AE3F3;
            font-family: var(--mono-font), monospace;
            background: rgba(42, 227, 243, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 2px 6px;
        }

        .roll-chunk {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            padding: 2px 3px;
            /*background: rgba(0, 0, 0, 0.03);*/
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(42, 227, 243, 0.10);
            border-radius: 5px;
        }

        .result-range {
            font-size: 0.85em;
            color: #a0aec0;
        }

        /* Range label badges: (Abs), (Mod), and (Limit) */
        .range-label {
            font-size: 0.85em;
            color: #718096;
            margin-left: 2px;
        }

        .result-math {
            font-size: 1em;
            color: #a0aec0;
            font-family: var(--mono-font), monospace;
        }

        /* Distributed die result: game result prominent, raw math subtle */
        .roll-val,
        .die-game {
            color: #2AE3F3;
            font-weight: 500;
            text-align: center;
        }

        .roll-val {
            flex-shrink: 0;
        }

        .die-game {
            display: inline-flex;
            align-items: baseline;
            padding: 2px 3px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(42, 227, 243, 0.10);
            border-radius: 5px;
            margin-right: 2px;
        }

        .die-game-val {
            display: inline-block;
            text-align: center;
        }

        /* Value was raised to floor limit: underline with offset, thicker and colored */
        .die-clamp-floor {
            font-style: normal;
            text-decoration-line: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            text-decoration-color: var(--clamp-floor);
        }

        /* Value was lowered to ceiling limit: overline, thicker and colored */
        .die-clamp-ceiling {
            font-style: normal;
            text-decoration-line: overline;
            text-decoration-thickness: 2px;
            text-decoration-color: var(--clamp-ceil);
        }

        .die-explode-standard {
            border-color: rgba(var(--glow-core), var(--border-opacity)) !important;
            box-shadow:
                0 0 var(--inner-spread) rgba(var(--glow-core), var(--inner-opacity)),
                0 0 var(--outer-spread) rgba(var(--glow-mid), var(--outer-opacity));
        }

        .die-explode-compound {
            border-color: rgba(var(--glow2-core), var(--border-opacity)) !important;
            box-shadow:
                0 0 var(--inner-spread) rgba(var(--glow2-core), var(--inner-opacity)),
                0 0 var(--outer-spread) rgba(var(--glow2-mid), var(--outer-opacity));
        }

        .die-compound-val {
            font-style: italic;
        }

        /* Each die-cell keeps game-result + raw-math together when wrapping */
        .die-cell {
            display: inline-flex;
            align-items: baseline;
            white-space: nowrap;
        }

        /* Raw value within die-raw: right-aligned for digit-count consistency */
        .die-raw-val {
            display: inline-block;
            text-align: right;
        }

        .die-raw {
            color: #718096;
            font-size: 0.88em;
            margin-right: 4px;
        }
        .die-dropped {
            color: #8c96ac;
            opacity: 0.55;
            text-decoration-line: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: rgba(180, 192, 214, 0.9);
            text-decoration-skip-ink: none;
        }

        .die-critical-success {
            color: #4ade80;
            font-weight: 700;
        }

        .die-critical-failure {
            color: #f87171;
            font-weight: 700;
        }

        .error {
            color: #ff8a80;
            text-align: center;
            padding: 10px;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid #e74c3c;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        body.force-keypad #diceInput {
            display: none !important;
        }

        body.force-keypad #dicePseudoInput {
            display: block !important;
        }

        body.force-keypad .keypad {
            display: grid !important;
        }

        body.force-keyboard #diceInput {
            display: block !important;
        }

        body.force-keyboard #dicePseudoInput {
            display: none !important;
        }

        body.force-keyboard .keypad {
            display: none !important;
        }

        body.force-keypad {
            padding: 0;
        }

        body.fit-to-width {
            padding: 0;
        }

        body.fit-to-width .container {
            max-width: none;
            border-radius: 0;
            box-shadow: none;
        }

        body.force-keypad .container {
            padding: 8px;
            border-radius: 0;
        }


        body.force-keypad .results {
            padding: 3px;
        }

        body.force-keypad .result-item {
            padding: 10px 5px;
        }

        body.force-keypad .result-rolls {
            padding: 3px 4px;
        }

    </style>
</head>

  /**
   * DiceNotation - All dice notation business logic (pure, no DOM)
   * Handles parsing, validation, rolling, and error messages.
   *
   * Supported notation (PRD #1):
   *   NdX                   - basic roll
   *   NdX-M / NdX+M         - distributed modifier (applied to each die)
   *   NdX-M-F / NdX+M+C     - distributed modifier with floor/ceiling limit
   *   NdX-M-F+C / NdX+M-F+C - distributed modifier with both floor and ceiling
   *   NdX -M / NdX +M       - aggregated modifier (applied to sum)
   *   NdX -M-F / NdX +M+C   - aggregated modifier with floor/ceiling limit
   *   NdX -M-F+C / NdX +M-F+C - aggregated modifier with both floor and ceiling
   *   B NdX[...]             - batch: roll the expression B times
   *   Multiple collections separated by spaces
   *
   * Floor/Ceiling: any modifier may be followed by a floor (-F) and/or ceiling (+C) in any order.
   */
  const DiceNotation = {
    MAX_EXPLOSION_ITERATIONS: 20,
    MIN_EXPLOSION_THRESHOLD: 2,

    /**
     * Parse dice notation string into structured collection data.
     * @param {string} input - Notation like "3d6 4d12" or "2 3d4-2-0"
     * @returns {Object} {collections: Array|null, error: string|null}
     */
    parse(input) {
      const ast = this._parseToAST(input);
      if (ast.error) return {collections: null, error: ast.error};
      return {collections: this._astToCollections(ast.root), error: null};
    },

    _parseToAST(input) {
      if (!input || typeof input !== 'string') return {root: null, error: 'INVALID_FORMAT'};
      const trimmed = input.trim();
      if (!trimmed) return {root: null, error: 'INVALID_FORMAT'};

      const tokens = trimmed.split(/\s+/);
      const root = {type: 'Expression', groups: []};
      let i = 0;
      let totalCount = 0;
      const pureIntRe = /^\d+$/;
      const aggModRe = /^([+-])(\d+)(([+-])(\d+)(([+-])(\d+))?)?$/;

      while (i < tokens.length) {
        let batchCount = 1;
        if (pureIntRe.test(tokens[i])) {
          batchCount = parseInt(tokens[i], 10);
          i++;
          if (batchCount <= 0 || i >= tokens.length) return {root: null, error: 'INVALID_FORMAT'};
        }

        const parsedDice = this._parseDiceToken(tokens[i]);
        if (parsedDice.error) return {root: null, error: parsedDice.error};
        const group = parsedDice.group;

        if (group.count <= 0 || group.sides <= 0) return {root: null, error: 'INVALID_FORMAT'};
        if (group.count > DiceApp.MAX_DICE_COUNT) return {root: null, error: 'TOO_MANY_DICE'};
        if (group.sides > DiceApp.MAX_DIE_SIDES) return {root: null, error: 'TOO_MANY_SIDES'};

        totalCount += group.count * batchCount;
        if (totalCount > DiceApp.MAX_DICE_COUNT) return {root: null, error: 'TOO_MANY_DICE'};

        if (group.modifierMode !== 'none' && Math.abs(group.modifier) > DiceApp.MAX_MODIFIER) {
          return {root: null, error: 'MODIFIER_TOO_LARGE'};
        }
        if ((group.floor !== null && group.floor > DiceApp.MAX_MODIFIER) ||
            (group.ceiling !== null && group.ceiling > DiceApp.MAX_MODIFIER)) {
          return {root: null, error: 'MODIFIER_TOO_LARGE'};
        }

        i++;

        // Parse optional space-separated aggregated modifier token if no distributed modifier exists.
        if (i < tokens.length && group.modifierMode === 'none') {
          const aggMatch = tokens[i].match(aggModRe);
          if (aggMatch) {
            const modSign = aggMatch[1];
            group.modifier = parseInt(modSign + aggMatch[2], 10);
            group.modifierSign = modSign;
            group.modifierMode = 'aggregated';
            if (Math.abs(group.modifier) > DiceApp.MAX_MODIFIER) return {root: null, error: 'MODIFIER_TOO_LARGE'};
            if (aggMatch[3]) {
              const firstLimSign = aggMatch[4];
              const firstLimValue = parseInt(aggMatch[5], 10);
              if (firstLimValue > DiceApp.MAX_MODIFIER) return {root: null, error: 'MODIFIER_TOO_LARGE'};
              if (firstLimSign === '-') { group.floor = firstLimValue; } else { group.ceiling = firstLimValue; }
              if (aggMatch[6]) {
                const secondLimSign = aggMatch[7];
                const secondLimValue = parseInt(aggMatch[8], 10);
                if (secondLimValue > DiceApp.MAX_MODIFIER) return {root: null, error: 'MODIFIER_TOO_LARGE'};
                if (secondLimSign === '-') {
                  if (group.floor !== null) return {root: null, error: 'INVALID_OPERATOR_FOR_LIMIT'};
                  group.floor = secondLimValue;
                } else {
                  if (group.ceiling !== null) return {root: null, error: 'INVALID_OPERATOR_FOR_LIMIT'};
                  group.ceiling = secondLimValue;
                }
              }
            }
            i++;
          }
        }

        root.groups.push({
          type: 'DiceGroup',
          batchCount,
          ...group
        });
      }

      return {root, error: null};
    },

    _astToCollections(root) {
      if (!root || !Array.isArray(root.groups) || root.groups.length === 0) return null;
      return root.groups.map(g => ({
        batchCount: g.batchCount,
        count: g.count,
        sides: g.sides,
        modifier: g.modifier,
        modifierSign: g.modifierSign,
        floor: g.floor,
        ceiling: g.ceiling,
        modifierMode: g.modifierMode,
        explodeMode: g.explodeMode,
        explodeThreshold: g.explodeThreshold,
        filterAction: g.filterAction,
        filterDirection: g.filterDirection,
        filterCount: g.filterCount
      }));
    },

    _parseDiceToken(token) {
      const baseMatch = token.match(/^(\d+)d(\d+)/i);
      if (!baseMatch) return {group: null, error: 'INVALID_FORMAT'};

      const count = parseInt(baseMatch[1], 10);
      const sides = parseInt(baseMatch[2], 10);
      let idx = baseMatch[0].length;

      const group = {
        count,
        sides,
        modifier: 0,
        modifierSign: null,
        floor: null,
        ceiling: null,
        modifierMode: 'none',
        explodeMode: 'none',
        explodeThreshold: null,
        filterAction: null,
        filterDirection: null,
        filterCount: null
      };

      // Explosion: !, !!, !Y, !!Y
      if (idx < token.length && token[idx] === '!') {
        idx++;
        if (idx < token.length && token[idx] === '!') {
          group.explodeMode = 'compound';
          idx++;
          let thresholdDigits = '';
          while (idx < token.length && /[0-9]/.test(token[idx])) {
            thresholdDigits += token[idx];
            idx++;
          }
          group.explodeThreshold = thresholdDigits ? parseInt(thresholdDigits, 10) : sides;
        } else {
          group.explodeMode = 'standard';
          let thresholdDigits = '';
          while (idx < token.length && /[0-9]/.test(token[idx])) {
            thresholdDigits += token[idx];
            idx++;
          }
          group.explodeThreshold = thresholdDigits ? parseInt(thresholdDigits, 10) : sides;
        }
        if (group.explodeThreshold < this.MIN_EXPLOSION_THRESHOLD || group.explodeThreshold > sides) {
          return {group: null, error: 'INVALID_EXPLODE_THRESHOLD'};
        }
      }

      // Filter: ++Y, +-Y, -+Y, --Y
      if (idx + 2 <= token.length && (token[idx] === '+' || token[idx] === '-') && (token[idx + 1] === '+' || token[idx + 1] === '-')) {
        const actionOp = token[idx];
        const directionOp = token[idx + 1];
        idx += 2;

        let filterDigits = '';
        while (idx < token.length && /[0-9]/.test(token[idx])) {
          filterDigits += token[idx];
          idx++;
        }
        if (!filterDigits) return {group: null, error: 'INVALID_FORMAT'};
        group.filterCount = parseInt(filterDigits, 10);
        if (group.filterCount <= 0) return {group: null, error: 'INVALID_FORMAT'};
        group.filterAction = actionOp === '+' ? 'keep' : 'drop';
        group.filterDirection = directionOp === '+' ? 'high' : 'low';
      }

      // Distributed modifier / limit: (+|-)N((+|-)N)?
      if (idx < token.length && (token[idx] === '+' || token[idx] === '-') && idx + 1 < token.length && /[0-9]/.test(token[idx + 1])) {
        const modSign = token[idx];
        idx++;
        let modDigits = '';
        while (idx < token.length && /[0-9]/.test(token[idx])) {
          modDigits += token[idx];
          idx++;
        }
        if (!modDigits) return {group: null, error: 'INVALID_FORMAT'};
        group.modifier = parseInt(modSign + modDigits, 10);
        group.modifierSign = modSign;
        group.modifierMode = 'distributed';

        for (let n = 0; n < 2; n++) {
          if (idx >= token.length || (token[idx] !== '+' && token[idx] !== '-')) break;
          if (idx + 1 >= token.length || !/[0-9]/.test(token[idx + 1])) break;
          const limSign = token[idx];
          idx++;
          let limDigits = '';
          while (idx < token.length && /[0-9]/.test(token[idx])) {
            limDigits += token[idx];
            idx++;
          }
          if (!limDigits) return {group: null, error: 'INVALID_FORMAT'};
          const limValue = parseInt(limDigits, 10);
          if (limSign === '-') {
            if (group.floor !== null) return {group: null, error: 'INVALID_OPERATOR_FOR_LIMIT'};
            group.floor = limValue;
          } else {
            if (group.ceiling !== null) return {group: null, error: 'INVALID_OPERATOR_FOR_LIMIT'};
            group.ceiling = limValue;
          }
        }
      }

      if (idx !== token.length) return {group: null, error: 'INVALID_FORMAT'};
      return {group, error: null};
    },

    /**
     * Validate dice notation without rolling
     * @param {string} input
     * @returns {Object} {valid: boolean, error: string|null}
     */
    validate(input) {
      const {collections, error} = this.parse(input);
      return {valid: collections !== null, error};
    },

    _rollDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    },

    /**
     * Roll dice and return raw results
     * @param {number} count - Number of dice
     * @param {number} sides - Sides per die
     * @returns {Uint32Array} Individual roll results
     */
    roll(count, sides) {
      const rolls = new Uint32Array(count);
      for (let i = 0; i < count; i++) {
        rolls[i] = this._rollDie(sides);
      }
      return rolls;
    },

    _applyExplosions(rollDetails, sides, explodeMode, explodeThreshold, rollFn) {
      if (!explodeMode || explodeMode === 'none') return;
      const threshold = explodeThreshold || sides;
      for (const detail of rollDetails) {
        let last = detail.chain[detail.chain.length - 1];
        let loops = 0;
        while (last >= threshold && loops < this.MAX_EXPLOSION_ITERATIONS) {
          const next = rollFn(sides);
          detail.chain.push(next);
          last = next;
          loops++;
        }
        detail.compound = explodeMode === 'compound';
        detail.displayValue = detail.chain.reduce((s, v) => s + v, 0);
      }
    },

    _applyFilter(rollDetails, filterAction, filterDirection, filterCount) {
      if (!filterAction || !filterDirection || !filterCount) return;
      if (filterCount >= rollDetails.length) return; // safety rule: preserve default all-kept state

      const ranked = rollDetails
        .map((detail, index) => ({detail, index}))
        .sort((a, b) => {
          if (a.detail.displayValue !== b.detail.displayValue) {
            return filterDirection === 'high'
              ? b.detail.displayValue - a.detail.displayValue
              : a.detail.displayValue - b.detail.displayValue;
          }
          return a.index - b.index;
        });

      const marked = new Set();
      if (filterAction === 'keep') {
        for (let i = 0; i < filterCount; i++) {
          marked.add(ranked[i].index);
        }
        rollDetails.forEach((d, i) => {
          d.kept = marked.has(i);
          d.isDropped = !d.kept;
        });
      } else {
        for (let i = 0; i < filterCount; i++) {
          marked.add(ranked[i].index);
        }
        rollDetails.forEach((d, i) => {
          d.kept = !marked.has(i);
          d.isDropped = !d.kept;
        });
      }
    },

    /**
     * Build a display formula string from parsed collection fields
     * @param {number} count
     * @param {number} sides
     * @param {number} modifier
     * @param {number|null} floor - minimum clamp value (null if none)
     * @param {number|null} ceiling - maximum clamp value (null if none)
     * @param {string} modifierMode - 'none'|'distributed'|'aggregated'
     * @param {Object} advanced - {explodeMode, explodeThreshold, filterAction, filterDirection, filterCount}
     * @returns {string}
     */
    buildFormula(count, sides, modifier, floor, ceiling, modifierMode, advanced = {}) {
      let s = `${count}d${sides}`;
      const {
        explodeMode = 'none',
        explodeThreshold = null,
        filterAction = null,
        filterDirection = null,
        filterCount = null,
        modifierSign = null
      } = advanced;

      if (explodeMode === 'compound') {
        s += (explodeThreshold !== null && explodeThreshold !== sides) ? `!!${explodeThreshold}` : '!!';
      } else if (explodeMode === 'standard') {
        s += (explodeThreshold !== null && explodeThreshold !== sides) ? `!${explodeThreshold}` : '!';
      }

      if (filterAction && filterDirection && filterCount) {
        const actionOp = filterAction === 'keep' ? '+' : '-';
        const directionOp = filterDirection === 'high' ? '+' : '-';
        s += `${actionOp}${directionOp}${filterCount}`;
      }

      if (modifierMode !== 'none') {
        const modStr = modifier === 0
          ? (modifierSign === '-' ? '-0' : '+0')
          : (modifier >= 0 ? `+${modifier}` : `${modifier}`);
        s += modifierMode === 'aggregated' ? ` ${modStr}` : modStr;
        if (floor !== null) { s += `-${floor}`; }
        if (ceiling !== null) { s += `+${ceiling}`; }
      }
      return s;
    },

    _formatChain(detail) {
      if (!detail.chain || detail.chain.length <= 1) return `${detail.raw}`;
      if (detail.compound) return `${detail.displayValue}!!`;
      return `[${detail.chain.map((v, idx) => (idx === detail.chain.length - 1 ? `${v}` : `${v}!`)).join('+')}]`;
    },

    /**
     * Initialize roll details.
     * @private
     */
    _initializeRollDetails(rawRolls, sides) {
      return Array.from(rawRolls).map(raw => ({
        raw,
        chain: [raw],
        displayValue: raw,
        rawDisplay: `${raw}`,
        resultDisplay: `${raw}`,
        kept: true,
        isDropped: false,
        compound: false,
        isCriticalSuccess: raw === sides,
        isCriticalFailure: raw === 1
      }));
    },

    /**
     * Expand standard explosions into separate roll details.
     * @private
     */
    _expandStandardExplosions(rollDetails, sides) {
      const expanded = [];
      rollDetails.forEach(d => {
        if (!d.chain || d.chain.length <= 1) {
          expanded.push({
            raw: d.raw,
            chain: [d.raw],
            displayValue: d.raw,
            rawDisplay: `${d.raw}`,
            resultDisplay: `${d.raw}`,
            kept: d.kept,
            isDropped: d.isDropped,
            compound: false,
            isCriticalSuccess: d.raw === sides,
            isCriticalFailure: d.raw === 1
          });
          return;
        }

        d.chain.forEach(v => {
          expanded.push({
            raw: v,
            chain: d.chain.slice(),
            displayValue: v,
            rawDisplay: `${v}`,
            resultDisplay: `${v}`,
            kept: true,
            isDropped: false,
            compound: false,
            isCriticalSuccess: v === sides,
            isCriticalFailure: v === 1
          });
        });
      });
      return expanded;
    },

    /**
     * Apply display formatting to roll details.
     * @private
     */
    _applyDisplayFormatting(rollDetails, explodeMode) {
      rollDetails.forEach(d => {
        if (explodeMode === 'compound') {
          d.rawDisplay = this._formatChain(d);
          d.resultDisplay = d.chain.length > 1 ? `${d.displayValue}!!` : `${d.displayValue}`;
        } else {
          d.rawDisplay = `${d.raw}`;
          d.resultDisplay = `${d.displayValue}`;
        }
      });
    },

    /**
     * Compute result for distributed modifier mode.
     * @private
     */
    _computeDistributionResult(formula, rollDetails, keptDetails, sides, modifier, floor, ceiling) {
      const effectiveCount = keptDetails.length;
      const dieResults = rollDetails.map(d => {
        const modified = d.displayValue + modifier;
        let result = modified;
        let indicator = '';
        if (d.kept) {
          if (floor !== null && result < floor) { result = floor; indicator = '*'; }
          if (ceiling !== null && result > ceiling) { result = ceiling; indicator = '^'; }
        }
        return {
          raw: d.raw,
          rawDisplay: d.rawDisplay,
          result: d.kept ? result : d.displayValue,
          resultDisplay: d.kept
            ? (d.compound && d.chain.length > 1 ? `${result}!!` : `${result}`)
            : d.resultDisplay,
          indicator,
          kept: d.kept,
          isDropped: d.isDropped,
          chain: d.chain.slice(),
          compound: d.compound,
          isCriticalSuccess: d.isCriticalSuccess,
          isCriticalFailure: d.isCriticalFailure
        };
      });

      const total = dieResults.reduce((s, d) => s + (d.kept ? d.result : 0), 0);

      const rangeRaw = {min: effectiveCount, max: effectiveCount * sides};
      const perDieMin = 1 + modifier;
      const perDieMax = sides + modifier;
      const rangeMod = {min: effectiveCount * perDieMin, max: effectiveCount * perDieMax};
      const hasClamp = floor !== null || ceiling !== null;
      let limitMin = perDieMin;
      let limitMax = perDieMax;
      if (floor !== null) {
        limitMin = Math.max(limitMin, floor);
        limitMax = Math.max(limitMax, floor);
      }
      if (ceiling !== null) {
        limitMin = Math.min(limitMin, ceiling);
        limitMax = Math.min(limitMax, ceiling);
      }
      const rangeLimit = hasClamp
        ? {min: effectiveCount * limitMin, max: effectiveCount * limitMax}
        : null;

      return {
        formula, mode: 'distributed', dieResults, rollDetails, total, modifier, rangeRaw, rangeMod, rangeLimit, sides,
        floor, ceiling, hasClamp
      };
    },

    /**
     * Compute result for aggregated modifier mode.
     * @private
     */
    _computeAggregatedResult(formula, rollDetails, keptDetails, sides, modifier, floor, ceiling) {
      const effectiveCount = keptDetails.length;
      const rolls = rollDetails.map(d => d.raw);
      const rawSum = keptDetails.reduce((s, d) => s + d.displayValue, 0);
      const modifiedSum = rawSum + modifier;
      let total = modifiedSum;
      let indicator = '';
      if (floor !== null && total < floor) { total = floor; indicator = '*'; }
      if (ceiling !== null && total > ceiling) { total = ceiling; indicator = '^'; }
      const rawMin = effectiveCount;
      const rawMax = effectiveCount * sides;
      const rangeRaw = {min: rawMin, max: rawMax};
      const modifiedMin = rawMin + modifier;
      const modifiedMax = rawMax + modifier;
      const rangeMod = {min: modifiedMin, max: modifiedMax};
      const hasClamp = floor !== null || ceiling !== null;
      let limitMin = modifiedMin;
      let limitMax = modifiedMax;
      if (floor !== null) {
        limitMin = Math.max(limitMin, floor);
        limitMax = Math.max(limitMax, floor);
      }
      if (ceiling !== null) {
        limitMin = Math.min(limitMin, ceiling);
        limitMax = Math.min(limitMax, ceiling);
      }
      const rangeLimit = hasClamp ? {min: limitMin, max: limitMax} : null;
      return {
        formula, mode: 'aggregated', rolls, rollDetails, rawSum, modifiedSum, total, indicator, modifier, rangeRaw, rangeMod, rangeLimit, sides,
        floor, ceiling, hasClamp
      };
    },

    /**
     * Compute roll result with modifier/limit applied.
     * @param {Uint32Array|number[]} rawRolls - Raw die values
     * @param {Object} opts - collection options
     * @param {Function|null} nextRollFn - Optional deterministic roller for explosions
     * @returns {Object} Result object
     */
    computeResult(rawRolls, {
      count, sides, modifier, floor = null, ceiling = null, modifierMode, modifierSign = null,
      explodeMode = 'none', explodeThreshold = null,
      filterAction = null, filterDirection = null, filterCount = null
    }, nextRollFn = null) {
      const formula = DiceNotation.buildFormula(
        count, sides, modifier, floor, ceiling, modifierMode,
        {explodeMode, explodeThreshold, filterAction, filterDirection, filterCount, modifierSign}
      );

      const rollFn = typeof nextRollFn === 'function' ? nextRollFn : (s) => DiceNotation._rollDie(s);
      let rollDetails = this._initializeRollDetails(rawRolls, sides);

      this._applyExplosions(rollDetails, sides, explodeMode, explodeThreshold, rollFn);
      if (explodeMode === 'standard') {
        rollDetails = this._expandStandardExplosions(rollDetails, sides);
      }

      this._applyFilter(rollDetails, filterAction, filterDirection, filterCount);
      this._applyDisplayFormatting(rollDetails, explodeMode);

      const keptDetails = rollDetails.filter(d => d.kept);
      const effectiveCount = keptDetails.length;

      if (modifierMode === 'none') {
        const rolls = rollDetails.map(d => d.raw);
        const total = keptDetails.reduce((s, d) => s + d.displayValue, 0);
        const min = effectiveCount;
        const max = effectiveCount * sides;
        return {formula, mode: 'none', rolls, rollDetails, total, min, max, sides};
      }

      if (modifierMode === 'distributed') {
        return this._computeDistributionResult(formula, rollDetails, keptDetails, sides, modifier, floor, ceiling);
      }

      return this._computeAggregatedResult(formula, rollDetails, keptDetails, sides, modifier, floor, ceiling);
    },

    /**
     * Get user-friendly error message
     * @param {string} errorCode
     * @returns {string}
     */
    getErrorMessage(errorCode) {
      const messages = {
        'INVALID_FORMAT': 'Invalid dice notation. Use format like "3d6 4d12"',
        'TOO_MANY_DICE': `Too many dice! Maximum allowed is ${DiceApp.MAX_DICE_COUNT.toLocaleString()}.`,
        'TOO_MANY_SIDES': `Too many sides! Maximum allowed is ${DiceApp.MAX_DIE_SIDES.toLocaleString()}.`,
        'INVALID_OPERATOR_FOR_LIMIT': 'Invalid operator for limit. Cannot specify the same limit type twice (e.g., two floors or two ceilings).',
        'MODIFIER_TOO_LARGE': `Modifier or limit too large! Maximum allowed is ${DiceApp.MAX_MODIFIER.toLocaleString()}.`,
        'INVALID_EXPLODE_THRESHOLD': 'Invalid explosion threshold. Use !Y or !!Y where Y is at least 2 and no greater than die sides.'
      };
      return messages[errorCode] || 'Unknown error';
    }
  };

  /**
   * DiceInput - Dual-mode input rendering and mode switching (UI only)
   * Handles keyboard and keypad display and interactions
   */
  const DiceInput = {
    keyboard: null,  // Reference to real text input control
    keypad: null,    // Reference to pseudo input div
    keypadButtons: null, // Reference to keypad container

    /**
     * Initialize with DOM nodes
     */
    init(keyboardNode, keypadNode, keypadButtonsNode) {
      this.keyboard = keyboardNode;
      this.keypad = keypadNode;
      this.keypadButtons = keypadButtonsNode;
    },

    autoResizeKeyboard() {
      if (!this.keyboard) return;
      this.keyboard.style.height = 'auto';
      this.keyboard.style.height = `${this.keyboard.scrollHeight}px`;
    },

    /**
     * Switch to keyboard or keypad mode
     * @param {boolean} useKeypad
     */
    setMode(useKeypad) {
      document.body.classList.remove('force-keypad', 'force-keyboard');
      document.body.classList.add(useKeypad ? 'force-keypad' : 'force-keyboard');
      this.keyboard.disabled = useKeypad;
      if (!useKeypad) this.autoResizeKeyboard();
    },
    /**
     * Update display with value and cursor position
     * @param {string} value
     * @param {number} cursorPos
     * @param {boolean} isKeypadMode
     */
    setValue(value, cursorPos, isKeypadMode) {
      if (isKeypadMode) {
        this.updateKeypad(value, cursorPos);
      } else {
        this.updateKeyboard(value, cursorPos);
      }
    },

    /**
     * Update keyboard input
     */
    updateKeyboard(value, cursorPos) {
      // Only update the DOM value (and reposition cursor) when the value has
      // actually changed from an external source such as a URL-hash load or a
      // mode switch.  During normal typing the browser manages the cursor
      // natively, so we must not call setSelectionRange() or it will collapse
      // any selection the user is making (e.g. shift+click, shift+arrow).
      if (this.keyboard.value !== value) {
        this.keyboard.value = value;
        this.keyboard.setSelectionRange(cursorPos, cursorPos);
      }
      this.autoResizeKeyboard();
    },

    /**
     * Update keypad pseudo input
     */
    updateKeypad(value, cursorPos) {
      if (value === '') {
        this.keypad.classList.add('empty');
        this.keypad.innerHTML = '';
      } else {
        this.keypad.classList.remove('empty');
        const before = value.slice(0, cursorPos);
        const after = value.slice(cursorPos);
        this.keypad.innerHTML = `${before}<span class="cursor"></span>${after}`;
      }
    },

    /**
     * Focus the active input
     * @param {boolean} isKeypadMode
     */
    focus(isKeypadMode) {
      if (!isKeypadMode) {
        this.keyboard.focus();
      }
    }
  };

  /**
   * DiceApp (Die! By the Browser) | Copyright (C) 2026 Colin Kershaw
   * Licensed under GNU AGPLv3 (See file header for full notice).
   * A dice rolling application with keyboard and keypad support.
   * Organized using the namespace pattern for clean separation of concerns.
   */
  const DiceApp = {
    // Configuration
    PLACEHOLDER_TEXT: "e.g., 3d6 2 3d4-2-0 4d6 +5+20",
    MAX_DICE_COUNT: 100000,
    MAX_DIE_SIDES: 1000000,
    MAX_MODIFIER: 1000000,

    // State management (Model)
    state: {
      currentValue: '',
      cursorPosition: 0,
      mode: 'auto', // 'auto', 'keyboard', or 'keypad'
      resolvedMode: null, // Actual mode after resolution: 'keyboard' or 'keypad'
      fitToWidth: false,
      rollResults: [],
      errorMessage: '',
      isRolling: false,
      spinnerPlaceholderHeight: 0
    },

    // DOM element cache
    nodes: {},

    // Utility functions (URL-specific, no dice logic)
    utils: {

      /**
       * Persist mode and layout preferences.
       */
      savePreferences() {
        try {
          const {mode, fitToWidth} = DiceApp.state;
          localStorage.setItem('diceAppPrefs', JSON.stringify({mode, fitToWidth}));
        } catch (error) {
          // Ignore storage errors (private mode, disabled storage, etc.)
        }
      },

      /**
       * Load persisted mode and layout preferences.
       * @returns {{mode?: string, fitToWidth?: boolean}}
       */
      loadPreferences() {
        try {
          const raw = localStorage.getItem('diceAppPrefs');
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return {
            mode: parsed?.mode,
            fitToWidth: parsed?.fitToWidth
          };
        } catch (error) {
          return {};
        }
      },

      /**
       * Get query parameter from URL hash
       * @param {string} param - Parameter name
       * @returns {string|null}
       */
      getQueryParam(param) {
        const hash = window.location.hash.slice(1); // Remove #
        const params = new URLSearchParams(hash);
        return params.get(param);
      },

      /**
       * Update URL hash parameter (only if there's actual content)
       * @param {string} param - Parameter name
       * @param {string} value - Parameter value
       */
      setQueryParam(param, value) {
        const hash = window.location.hash.slice(1);
        const params = new URLSearchParams(hash);

        if (value) {
          params.set(param, value);
          window.location.hash = '#' + params.toString();
        } else {
          params.delete(param);
          const newHash = params.toString();
          // Only set hash if there are other params, otherwise remove it entirely
          if (newHash) {
            window.location.hash = '#' + newHash;
          } else {
            // Push a new "no-hash" state so Back/Forward history is preserved
            history.pushState(null, null, ' ');
          }
        }
      }
    },

    // View (pure render functions, Model -> View only)
    ui: {

      /**
       * Check if device should use keypad mode (reads from Model only)
       * @returns {boolean}
       */
      isKeypadMode() {
        const {state} = DiceApp;
        return state.resolvedMode === 'keypad';
      },

      /**
       * Update the entire UI from Model
       */
      renderAll() {
        this.syncLayoutClasses();
        this.renderMode();
        this.renderResults();
        this.renderMenu();
      },

      syncLayoutClasses() {
        document.body.classList.toggle('fit-to-width', DiceApp.state.fitToWidth);
      },

      /**
       * Render mode-specific layout
       */
      renderMode() {
        const {state} = DiceApp;
        const isKeypad = this.isKeypadMode();

        DiceInput.setMode(isKeypad);
        DiceInput.setValue(state.currentValue, state.cursorPosition, isKeypad);
      },

      /**
       * Render roll results and errors
       */
      renderResults() {
        const {nodes, state} = DiceApp;
        const stripExplodeMarkers = (value) => `${value}`.replace(/!/g, '');
        const isExploded = (die) => Array.isArray(die?.chain) && die.chain.length > 1;

        /**
         * Build a range string. Shows calculation-vs-absolute ranges when available.
         * @param {{min,max}} rangeRaw
         * @param {{min,max}|null} rangeMod
         * @param {{min,max}|null} rangeLimit
         * @returns {string}
         */
        const buildRangeStr = (rangeRaw, rangeMod, rangeLimit) => {
          const modOrRaw = rangeMod || rangeRaw;
          if (rangeLimit) {
            return `${rangeLimit.min}–${rangeLimit.max} <span class="range-label">(Limit)</span>` +
              `&nbsp;&nbsp;${modOrRaw.min}–${modOrRaw.max} <span class="range-label">(Mod)</span>` +
              `&nbsp;&nbsp;${rangeRaw.min}–${rangeRaw.max} <span class="range-label">(Abs)</span>`;
          }
          if (modOrRaw.min !== rangeRaw.min || modOrRaw.max !== rangeRaw.max) {
            return `${modOrRaw.min}–${modOrRaw.max} <span class="range-label">(Mod)</span>` +
              `&nbsp;&nbsp;${rangeRaw.min}–${rangeRaw.max} <span class="range-label">(Abs)</span>`;
          }
          return `${rangeRaw.min}–${rangeRaw.max}`;
        };

        /**
         * Build padded roll-value spans for basic/aggregated rolls.
         * Each roll is right-aligned to the theoretical max digit width for the die type.
         * @param {number[]} rolls
         * @param {number} sides
         * @returns {string}
         */
        const rollValSpans = (rolls, sides) => {
          const w = String(sides).length;
          return rolls.map((v) =>
            `<span class="roll-chunk">` +
            `<span class="roll-val" style="min-width:${w}ch">${v}</span>` +
            `</span>`
          ).join('');
        };

        DiceApp.perf.mark('formatStart');
        const resultsHTML = state.rollResults.map((r, rIdx) => {
            /**
             * Render a game-result value with floor/ceiling visual decoration.
             * Model stores '*' (floor) and '^' (ceiling); View renders underline/overline.
             * No extra character is appended, so column width is purely digit-based.
             * @param {number} val - Displayed numeric value
             * @param {string} indicator - '' | '*' | '^'
             * @param {number} minWidth - ch width for alignment
             * @param extraClassName
             * @param chipClassName
             * @returns {string}
             */
            const gameSpan = (val, indicator, minWidth, extraClassName = '', chipClassName = '') => {
              const extraClass = extraClassName ? ` ${extraClassName}` : '';
              const cleanVal = stripExplodeMarkers(val);
              const inner = `<span class="die-game-val${extraClass}" style="min-width:${minWidth}ch">${cleanVal}</span>`;
              const classes = ['die-game'];
              if (indicator === '*') classes.push('die-clamp-floor');
              if (indicator === '^') classes.push('die-clamp-ceiling');
              if (chipClassName) classes.push(chipClassName);
              if (indicator === '*') {
                return `<span class="${classes.join(' ')}">${inner}</span>`;
              }
              if (indicator === '^') {
                return `<span class="${classes.join(' ')}">${inner}</span>`;
              }
              return `<span class="${classes.join(' ')}">${inner}</span>`;
            };

            const sortState = r.sortState || 'original';
            const sortStateLabel = sortState === 'desc' ? 'descending' : sortState === 'asc' ? 'ascending' : 'as rolled';
            const sortHandle = `<div class="sort-handle" role="button" aria-label="Sort order: ${sortStateLabel} (click to cycle)" data-sort="${sortState === 'original' ? '' : sortState}" title="Sort dice (click to cycle: descending → ascending → original)"></div>`;
            const sortGlyph = sortState === 'desc' ? '▼' : sortState === 'asc' ? '▲' : '';
            const rollsLabel = `<span class="result-lbl">Rolls:${sortGlyph ? `<span class="sort-indicator" aria-hidden="true">${sortGlyph}</span>` : ''}</span>`;
            const getSortedDetails = (arr) => {
              if (!arr) return arr;
              if (sortState === 'desc') return arr.slice().sort((a, b) => (b.displayValue ?? b.result ?? 0) - (a.displayValue ?? a.result ?? 0));
              if (sortState === 'asc') return arr.slice().sort((a, b) => (a.displayValue ?? a.result ?? 0) - (b.displayValue ?? b.result ?? 0));
              return arr;
            };

            if (r.mode === 'distributed') {
              const modStr = r.modifier >= 0 ? `+${r.modifier}` : `${r.modifier}`;

              // Theoretical max game-result width (digits only — indicator is now text-decoration).
              // A floor clamp (-) is the true minimum displayed value (result ≥ floor by definition).
              // A ceiling clamp (+) is the true maximum displayed value (result ≤ ceiling by definition).
              const theoreticalMinGame = r.floor !== null ? r.floor : 1 + r.modifier;
              const theoreticalMaxGame = r.ceiling !== null ? r.ceiling : r.sides + r.modifier;
              const hasCompoundExplode = r.dieResults.some(d => d.compound);
              const compoundWidth = String(r.sides * DiceNotation.MAX_EXPLOSION_ITERATIONS).length;
              const maxGameWidth = hasCompoundExplode
                ? compoundWidth
                : Math.max(String(theoreticalMinGame).length, String(theoreticalMaxGame).length);
              const maxRawWidth = hasCompoundExplode ? compoundWidth : String(r.sides).length;

              const rollsDisplay = getSortedDetails(r.dieResults).map(d => {
                const criticalClass = d.isCriticalSuccess
                  ? 'die-critical-success'
                  : d.isCriticalFailure
                    ? 'die-critical-failure'
                    : '';
                const droppedClass = d.isDropped ? 'die-dropped' : '';
                const exploded = isExploded(d);
                const isCompoundExplode = d.compound === true;
                const chipGlowClass = exploded
                  ? (isCompoundExplode ? 'die-explode-compound' : 'die-explode-standard')
                  : '';
                const rawText = stripExplodeMarkers(d.rawDisplay || `${d.raw}`);
                const rawValue = isCompoundExplode && exploded
                  ? `<span class="die-compound-val">${rawText}</span>`
                  : rawText;
                const gameText = Number(stripExplodeMarkers(d.resultDisplay || `${d.result}`));
                return `<span class="die-cell ${droppedClass}" role="group" aria-label="die: ${d.result}${d.indicator} (raw: ${rawText})">` +
                gameSpan(gameText, d.indicator, maxGameWidth, criticalClass, chipGlowClass) +
                `<span class="die-raw">=<span class="die-raw-val" style="min-width:${maxRawWidth}ch">${rawValue}</span>${modStr}</span>` +
                `</span>`
              }).join('');
              const rangeStr = buildRangeStr(r.rangeRaw, r.rangeMod || null, r.rangeLimit);
              return `
        <div class="result-item" data-result-index="${rIdx}">
          ${sortHandle}
          <div class="result-formula">${r.formula}</div>
          <div class="result-row"><span class="result-lbl">Total:</span><span class="result-value">${r.total}</span></div>
          <div class="result-row result-row--stacked">${rollsLabel}<span class="result-rolls">${rollsDisplay}</span></div>
          <div class="result-row"><span class="result-lbl">Range:</span><span class="result-range">${rangeStr}</span></div>
        </div>
      `;
            } else if (r.mode === 'aggregated') {
              const decoratedTotal = r.indicator === '*'
                ? `<span class="die-clamp-floor">${r.total}</span>`
                : r.indicator === '^'
                  ? `<span class="die-clamp-ceiling">${r.total}</span>`
                  : `${r.total}`;
              // rollDetails exists for current compute paths; fallback preserves compatibility
              // with any older saved/result objects that only provide r.rolls.
              const rollsDisplay = r.rollDetails
                ? getSortedDetails(r.rollDetails).map(d => {
                  const criticalClass = d.isCriticalSuccess
                    ? 'die-critical-success'
                    : d.isCriticalFailure
                      ? 'die-critical-failure'
                      : '';
                  const droppedClass = d.isDropped ? 'die-dropped' : '';
                  const exploded = isExploded(d);
                  const isCompoundExplode = d.compound === true;
                  const glowClass = exploded
                    ? (isCompoundExplode ? 'die-explode-compound' : 'die-explode-standard')
                    : '';
                  const chipWidth = isCompoundExplode
                    ? String(r.sides * DiceNotation.MAX_EXPLOSION_ITERATIONS).length
                    : String(r.sides).length;
                  const display = stripExplodeMarkers(d.resultDisplay || `${d.displayValue}`);
                  return `<span class="roll-chunk ${droppedClass} ${glowClass}">` +
                    `<span class="roll-val ${criticalClass}" style="min-width:${chipWidth}ch">${display}</span>` +
                    `</span>`;
                }).join('')
                : rollValSpans(r.rolls, r.sides);
              const mathStr = r.modifier >= 0
                ? `(${r.rawSum}) + ${r.modifier} = ${decoratedTotal}`
                : `(${r.rawSum}) - ${Math.abs(r.modifier)} = ${decoratedTotal}`;
              const rangeStr = buildRangeStr(r.rangeRaw, r.rangeMod || null, r.rangeLimit);
              return `
        <div class="result-item" data-result-index="${rIdx}">
          ${sortHandle}
          <div class="result-formula">${r.formula}</div>
          <div class="result-row"><span class="result-lbl">Total:</span><span class="result-value">${decoratedTotal}</span></div>
          <div class="result-row"><span class="result-lbl">Math:</span><span class="result-math">${mathStr}</span></div>
          <div class="result-row result-row--stacked">${rollsLabel}<span class="result-rolls">${rollsDisplay}</span></div>
          <div class="result-row"><span class="result-lbl">Range:</span><span class="result-range">${rangeStr}</span></div>
        </div>
      `;
            } else {
              // mode === 'none' (basic roll, no modifier)
              const rollsDisplay = r.rollDetails
                ? getSortedDetails(r.rollDetails).map(d => {
                  const criticalClass = d.isCriticalSuccess
                    ? 'die-critical-success'
                    : d.isCriticalFailure
                      ? 'die-critical-failure'
                      : '';
                  const droppedClass = d.isDropped ? 'die-dropped' : '';
                  const exploded = isExploded(d);
                  const isCompoundExplode = d.compound === true;
                  const glowClass = exploded
                    ? (isCompoundExplode ? 'die-explode-compound' : 'die-explode-standard')
                    : '';
                  const chipWidth = isCompoundExplode
                    ? String(r.sides * DiceNotation.MAX_EXPLOSION_ITERATIONS).length
                    : String(r.sides).length;
                  const display = stripExplodeMarkers(d.resultDisplay || `${d.displayValue}`);
                  return `<span class="roll-chunk ${droppedClass} ${glowClass}">` +
                    `<span class="roll-val ${criticalClass}" style="min-width:${chipWidth}ch">${display}</span>` +
                    `</span>`;
                }).join('')
                : rollValSpans(r.rolls, r.sides);
              return `
        <div class="result-item" data-result-index="${rIdx}">
          ${sortHandle}
          <div class="result-formula">${r.formula}</div>
          <div class="result-row"><span class="result-lbl">Total:</span><span class="result-value">${r.total}</span></div>
          <div class="result-row result-row--stacked">${rollsLabel}<span class="result-rolls">${rollsDisplay}</span></div>
          <div class="result-row"><span class="result-lbl">Range:</span><span class="result-range">${r.min}–${r.max}</span></div>
        </div>
      `;
            }
          }).join('');

        const htmlParts = [];
        if (state.errorMessage) {
          htmlParts.push(`<div class="error">${state.errorMessage}</div>`);
        }
        if (resultsHTML && !state.isRolling) {
          htmlParts.push(resultsHTML);
        }
        if (state.isRolling) {
          // Keep layout height stable while large-roll results are temporarily cleared.
          htmlParts.push(`<div class="results-placeholder" style="height:${Math.max(0, state.spinnerPlaceholderHeight)}px" aria-hidden="true"></div>`);
          htmlParts.push(`<div class="loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>Rolling...</span></div>`);
        }
        const newHTML = htmlParts.join('');
        DiceApp.perf.mark('formatEnd');

        // Only update DOM if content has changed to avoid "jumping" on every keystroke
        if (nodes.results.innerHTML !== newHTML) {
          DiceApp.perf.mark('domCommitStart');
          nodes.results.innerHTML = newHTML;
          DiceApp.perf.mark('domCommitEnd');
        }

        // Paint-adjacent timing: schedule two rAF callbacks after a results render.
        // Only triggered when actual results are ready (not for error-only or empty renders)
        // so that the measured rAF gap reflects a heavy content commit, not a trivial DOM swap.
        // The gap between domCommitEnd and the second rAF callback approximates
        // browser layout+paint latency (not a direct paint measurement).
        if (DiceApp.perf.isEnabled() && !state.isRolling && state.rollResults.length > 0) {
          DiceApp.perf.mark('paintAdjStart');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              DiceApp.perf.mark('paintAdjEnd');
              DiceApp.perf._report();
            });
          });
        }

        // Disable roll and clear buttons while rolling
        if (nodes.rollBtn) {
          nodes.rollBtn.disabled = state.isRolling;
        }
        if (nodes.clearBtn) {
          nodes.clearBtn.disabled = state.isRolling;
        }
      },

      /**
       * Render menu to show current mode
       */
      renderMenu() {
        const {state, nodes} = DiceApp;
        if (!nodes.menu) return;

        const menuItems = nodes.menu.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
          const mode = item.dataset.mode;
          const setting = item.dataset.setting;
          const check = item.querySelector('.menu-check');

          const isActive = (mode && mode === state.mode) ||
            (setting === 'fit-to-width' && state.fitToWidth);

          if (isActive) {
            item.classList.add('active');
            if (check) check.style.display = 'block';
          } else {
            item.classList.remove('active');
            if (check) check.style.display = 'none';
          }
        });
      },

      /**
       * Toggle menu visibility
       */
      toggleMenu() {
        DiceApp.nodes.menu.classList.toggle('active');
      },

      /**
       * Close menu
       */
      closeMenu(restoreHamburgerFocus = false) {
        DiceApp.nodes.menu.classList.remove('active');
        if (restoreHamburgerFocus && DiceApp.nodes.hamburger) {
          DiceApp.nodes.hamburger.focus();
        }
      }
    },

    // Controller (mediates all input, updates Model, then calls View)
    actions: {
      /**
       * Update current value and cursor from external source (like keyboard input or hash)
       * @param {string} val
       * @param {number} pos
       */
      updateInput(val, pos = (val ?? '').length) {
        const {state, ui} = DiceApp;
        state.currentValue = val;
        state.cursorPosition = (pos !== undefined) ? pos : val.length;
        ui.renderAll();
      },

      /**
       * Perform dice roll and display results
       */
      roll() {
        const {state, utils, ui, nodes} = DiceApp;

        if (state.isRolling) {
          return;
        }

        const notation = state.currentValue;
        // Clear any stale placeholder height carried over from a previous large roll.
        state.spinnerPlaceholderHeight = 0;

        DiceApp.perf.beginRoll(notation);
        DiceApp.perf.mark('parseStart');
        const {collections: parsed, error} = DiceNotation.parse(notation);
        DiceApp.perf.mark('parseEnd');

        if (!parsed) {
          state.errorMessage = DiceNotation.getErrorMessage(error);
          state.rollResults = [];
          state.isRolling = false;
          ui.renderAll();
          return;
        }

        const computeAndRender = () => {
          state.errorMessage = '';
          const nextResults = [];

          DiceApp.perf.mark('computeStart');
          for (const coll of parsed) {
            const {
              batchCount, count, sides, modifier, floor, ceiling, modifierMode, modifierSign,
              explodeMode, explodeThreshold, filterAction, filterDirection, filterCount
            } = coll;
            for (let b = 0; b < batchCount; b++) {
              const rawRolls = DiceNotation.roll(count, sides);
              const result = DiceNotation.computeResult(rawRolls, {
                count, sides, modifier, floor, ceiling, modifierMode, modifierSign,
                explodeMode, explodeThreshold, filterAction, filterDirection, filterCount
              });
              nextResults.push(result);
            }
          }
          DiceApp.perf.mark('computeEnd');

          state.rollResults = nextResults;

          utils.setQueryParam('dice', notation);
          if (!state.isRolling) {
            ui.renderAll();
            return;
          }
          setTimeout(() => {
            state.isRolling = false;
            state.spinnerPlaceholderHeight = 0;
            ui.renderAll();
          }, 0);
        };

        const estimatedDiceCount = parsed.reduce((sum, coll) => sum + (coll.batchCount * coll.count), 0);

        if (estimatedDiceCount >= 5000) {
          state.errorMessage = '';
          // Intentional read-before-clear: capture current rendered height so spinner
          // placeholder preserves layout/scroll stability while old results are removed.
          state.spinnerPlaceholderHeight = Math.ceil(nodes.results.getBoundingClientRect().height || 0);
          state.rollResults = [];
          DiceApp.perf.mark('spinnerRenderStart');
          state.isRolling = true;
          ui.renderAll();
          DiceApp.perf.mark('spinnerRenderEnd');
          requestAnimationFrame(computeAndRender);
          return;
        }

        computeAndRender();
      },

      /**
       * Clear all inputs and results
       */
      clear() {
        const {state, utils, ui} = DiceApp;

        if (state.isRolling) {
          return;
        }

        state.currentValue = '';
        state.cursorPosition = 0;
        state.rollResults = [];
        state.errorMessage = '';

        // Use setTimeout to ensure DOM updates before hash changes
        setTimeout(() => {
          utils.setQueryParam('dice', '');
        }, 0);

        ui.renderAll();
        DiceInput.focus(ui.isKeypadMode());
      },

      /**
       * Set display mode
       * @param {string} mode - 'auto', 'keyboard', or 'keypad'
       */
      setMode(mode) {
        const {state, actions, ui} = DiceApp;
        state.mode = mode;
        actions.detectInputMode();
        ui.renderAll();
        DiceApp.utils.savePreferences();
        DiceInput.focus(ui.isKeypadMode()); // Ensure the active input is focused after switch
        ui.closeMenu();
      },

      /**
       * Detect and set the resolved input mode based on device characteristics
       * This is the single source of truth for mode resolution (Controller layer)
       */
      detectInputMode() {
        const {state} = DiceApp;

        if (state.mode === 'keyboard') {
          state.resolvedMode = 'keyboard';
        } else if (state.mode === 'keypad') {
          state.resolvedMode = 'keypad';
        } else {
          // mode === 'auto' - detect based on device
          const width = window.innerWidth;
          const mobile = width <= 767;
          const tablet = width >= 768 && width <= 1023;
          const hasCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

          if (mobile) {
            state.resolvedMode = 'keypad';
          } else if (tablet && hasCoarsePointer) {
            state.resolvedMode = 'keypad';
          } else {
            state.resolvedMode = 'keyboard';
          }
        }
      },

      toggleFitToWidth() {
        const {state, ui} = DiceApp;
        state.fitToWidth = !state.fitToWidth;
        ui.renderAll();
        DiceApp.utils.savePreferences();
        ui.closeMenu();
      }
    },

    // Event handlers
    handlers: {
      /**
       * Handle desktop input events
       * @param {Event} e
       */
      onInput(e) {
        /** @type {HTMLTextAreaElement} */
        const target = e.target;
        const {value, selectionStart} = target;
        const beforeCursor = value.slice(0, selectionStart);
        const sanitizedBeforeCursor = beforeCursor.replace(/[\r\n]+/g, ' ');
        const sanitizedValue = value.replace(/[\r\n]+/g, ' ');

        if (sanitizedValue !== value) {
          target.value = sanitizedValue;
          target.setSelectionRange(sanitizedBeforeCursor.length, sanitizedBeforeCursor.length);
        }
        DiceApp.actions.updateInput(target.value, target.selectionStart);
      },

      /**
       * Insert a character at the current cursor position
       * @param {string} char
       */
      insertAtCursor(char) {
        const {state, ui} = DiceApp;
        state.currentValue = state.currentValue.slice(0, state.cursorPosition) +
          char +
          state.currentValue.slice(state.cursorPosition);
        state.cursorPosition++;
        ui.renderAll();
      },

      /**
       * Delete character before the current cursor position
       */
      deleteAtCursor() {
        const {state, ui} = DiceApp;
        if (state.cursorPosition > 0) {
          state.currentValue = state.currentValue.slice(0, state.cursorPosition - 1) +
            state.currentValue.slice(state.cursorPosition);
          state.cursorPosition--;
          ui.renderAll();
        }
      },

      /**
       * Move cursor by delta
       * @param {number} delta
       */
      moveCursor(delta) {
        const {state, ui} = DiceApp;
        const newPos = state.cursorPosition + delta;
        if (newPos >= 0 && newPos <= state.currentValue.length) {
          state.cursorPosition = newPos;
          ui.renderAll();
        }
      },

      /**
       * A mapping of keys to their respective handler functions
       * Initialized with static keys; numbers added dynamically
       */
      keyMap: {},

      /**
       * Initialize keyMap with all key mappings
       */
      initializeKeyMap() {
        // Static key mappings
        this.keyMap['Backspace'] = () => DiceApp.handlers.deleteAtCursor();
        this.keyMap['ArrowLeft'] = () => DiceApp.handlers.moveCursor(-1);
        this.keyMap['ArrowRight'] = () => DiceApp.handlers.moveCursor(1);
        this.keyMap[' '] = () => DiceApp.handlers.insertAtCursor(' ');
        this.keyMap['d'] = () => DiceApp.handlers.insertAtCursor('d');
        this.keyMap['D'] = () => DiceApp.handlers.insertAtCursor('d');
        this.keyMap['-'] = () => DiceApp.handlers.insertAtCursor('-');
        this.keyMap['+'] = () => DiceApp.handlers.insertAtCursor('+');
        this.keyMap['!'] = () => DiceApp.handlers.insertAtCursor('!');

        // Dynamic number key mappings (0-9)
        for (let i = 0; i <= 9; i++) {
          const digit = i.toString();
          this.keyMap[digit] = () => DiceApp.handlers.insertAtCursor(digit);
        }
      },

      /**
       * Handle keypad button clicks
       */
      onKeypadClick(e) {
        if (!e.target.classList.contains('key')) return;

        const {action, value} = e.target.dataset;

        // Check if action maps to a key in keyMap
        if (action && this.keyMap[action]) {
          this.keyMap[action]();
        } else if (value !== undefined) {
          this.insertAtCursor(value);
        }
      },

      /**
       * Handle keyboard input globally (works in both modes)
       */
      onKeyDownGlobal(e) {
        const {ui, actions, state} = DiceApp;

        // Global shortcuts (work in both modes)
        if (e.key === 'Escape') {
          if (!state.isRolling) {
            actions.clear();
          }
          return;
        }

        if (e.key === 'Enter') {
          e.preventDefault(); // Prevent textarea newlines; Enter should roll instead
          if (!state.isRolling) {
            actions.roll();
          }
          return;
        }

        // Keypad mode keyboard support
        if (ui.isKeypadMode()) {
          // Don't intercept browser shortcuts (Alt+D, Ctrl+L, etc.)
          if (e.altKey || e.ctrlKey || e.metaKey) return;

          // Check if key is mapped
          const mapped = this.keyMap[e.key];
          if (mapped) {
            e.preventDefault();
            if (!state.isRolling) {
              mapped();
            }
          }
        }
      },

      /**
       * Handle menu item clicks
       */
      onMenuClick(e) {
        const menuItem = e.target.closest('.menu-item');
        if (!menuItem) return;

        const mode = menuItem.dataset.mode;
        const setting = menuItem.dataset.setting;
        if (setting === 'fit-to-width') {
          DiceApp.actions.toggleFitToWidth();
          return;
        }
        DiceApp.actions.setMode(mode);
      },

      /**
       * Close menu when clicking outside
       */
      onDocumentClick(e) {
        const {nodes} = DiceApp;
        if (!nodes.menu.contains(e.target) &&
          !nodes.hamburger.contains(e.target) &&
          nodes.menu.classList.contains('active')) {
          DiceApp.ui.closeMenu(true);
        }
      }
    },

    // Performance instrumentation (opt-in, developer-oriented)
    // Activate via URL param ?perf=1  or  DiceApp.perf.enable()  in the browser console.
    // Each roll emits a console.group with four measured phases plus a paint-adjacent estimate.
    perf: {
      enabled: false,
      _notation: '',
      _marks: null,

      enable() {
        this.enabled = true;
        console.log('🔬 DiceApp perf instrumentation enabled.');
        console.log('   Roll dice to see per-phase timings in the console.');
        console.log('   To disable: DiceApp.perf.disable()');
      },

      disable() {
        this.enabled = false;
      },

      isEnabled() {
        return this.enabled;
      },

      /** Call at the very start of each roll to reset accumulated marks. */
      beginRoll(notation) {
        if (!this.enabled) return;
        this._notation = notation;
        this._marks = {};
      },

      /** Record a named timestamp (performance.now()). */
      mark(name) {
        if (!this.enabled || !this._marks) return;
        this._marks[name] = performance.now();
      },

      /** Duration in ms between two marks, or null if either is missing. */
      _dur(startMark, endMark) {
        const m = this._marks;
        if (!m || m[startMark] === undefined || m[endMark] === undefined) return null;
        return m[endMark] - m[startMark];
      },

      /**
       * Log a formatted timing report to the console.
       * Called automatically after the two-rAF paint-adjacent measurement completes.
       */
      _report() {
        if (!this.enabled || !this._marks) return;
        const parse      = this._dur('parseStart',     'parseEnd');
        const compute    = this._dur('computeStart',   'computeEnd');
        const format     = this._dur('formatStart',    'formatEnd');
        const domCommit  = this._dur('domCommitStart', 'domCommitEnd');
        const paintAdj   = this._dur('paintAdjStart',  'paintAdjEnd');

        const phases = [
          { name: 'parse',                    ms: parse },
          { name: 'compute',                  ms: compute },
          { name: 'format (HTML gen)',         ms: format },
          { name: 'DOM commit (innerHTML)',    ms: domCommit },
          { name: 'paint-adjacent (2×rAF)',   ms: paintAdj },
        ];

        const subtotal = [parse, compute, format, domCommit]
          .reduce((s, v) => s + (v ?? 0), 0);
        const total = subtotal + (paintAdj ?? 0);

        const label = this._notation ? `"${this._notation}"` : '(roll)';
        console.group(`🔬 Perf ${label}`);
        for (const { name, ms } of phases) {
          if (ms !== null) {
            console.log(`  ${name.padEnd(30)} ${ms.toFixed(2)} ms`);
          }
        }
        console.log(`  ${'── subtotal (excl. paint)'.padEnd(30)} ${subtotal.toFixed(2)} ms`);
        if (paintAdj !== null) {
          console.log(`  ${'── total (incl. 2×rAF)'.padEnd(30)} ${total.toFixed(2)} ms`);
        }
        console.log('');
        console.log('  ⓘ "paint-adjacent" = elapsed between the innerHTML write and the');
        console.log('     second requestAnimationFrame callback (~layout+paint latency).');
        console.log('     JS cannot directly observe GPU rasterisation; this is an upper');
        console.log('     bound that includes browser scheduling overhead.');
        console.groupEnd();
      },

      /** Return a shallow copy of the raw marks object (for programmatic use). */
      getLastMarks() {
        return this._marks ? { ...this._marks } : null;
      },
    },
