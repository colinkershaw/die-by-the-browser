<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--suppress HtmlWrongAttributeValue -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <!--suppress HtmlWrongAttributeValue -->
    <meta http-equiv="Pragma" content="no-cache">
    <!--suppress HtmlWrongAttributeValue -->
    <meta http-equiv="Expires" content="0">
    <title>Die! By the Browser (Dice Rolling App)</title>
    <meta name="theme-color" content="#2AE3F3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico"> <!-- Favicon -->

    <script>
      // Only load manifest if we're not on file://
      if (location.protocol !== 'file:') {
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.json';
        document.head.appendChild(link);
      }

      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      } else if (location.protocol === 'file:') {
        console.info('📱 Manifest and Service Workers unavailable on file:// - deploy to a web server for PWA features');
      }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --placeholder-text: "e.g., 3d6 4d12";
            --mono-font: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas, "Roboto Mono", "Liberation Mono";
            --clamp-floor: #7FD3FF; /* cyan */
            --clamp-ceil:  #FFD166; /* amber */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: conic-gradient(from 45deg at 50% 50%,
            #0a0e1f 0deg,
            #2AE3F3 90deg,
            #05699f 180deg,
            #1a2456 270deg,
            #0a0e1f 360deg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1a2238;
            color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            padding: 15px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        h1 {
            color: #2AE3F3;
            text-align: center;
            font-size: 1.5em;
            white-space: nowrap;
            flex: 1;
            margin: 0;
        }

        .hamburger {
            width: 30px;
            height: 30px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border-radius: 6px;
            transition: background 0.3s;
            flex-shrink: 0;
            flex-grow: 0;
            flex-basis: 30px;
        }

        .hamburger:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .hamburger span {
            width: 20px;
            height: 2px;
            background: #2AE3F3;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .menu {
            position: absolute;
            top: 70px;
            right: 30px;
            background: #252d4a;
            color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            padding: 10px;
            min-width: 200px;
            display: none;
            z-index: 1000;
        }

        /*noinspection CssUnusedSymbol*/
        .menu.active {
            display: block;
        }

        .menu-item {
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /*noinspection CssUnusedSymbol*/
        .menu-item.active {
            background: rgba(42, 227, 243, 0.2);
            color: #2AE3F3;
            font-weight: 600;
        }

        .menu-label {
            font-size: 0.95em;
        }

        .menu-check {
            color: #2AE3F3;
            font-size: 1.2em;
        }

        .input-section {
            margin-bottom: 20px;
        }

        #diceInput {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #2AE3F3;
            background: #0d142d;
            color: #ffffff;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        #diceInput:focus {
            border-color: #2AE3F3;
        }

        #dicePseudoInput {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #2AE3F3;
            border-radius: 10px;
            min-height: 52px;
            background: #0d142d;
            color: #ffffff;
            display: none;
            cursor: text;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /*noinspection CssUnusedSymbol*/
        #dicePseudoInput.active {
            display: block;
        }

        #dicePseudoInput.empty {
            color: #636e72;
        }

        #dicePseudoInput.empty::before {
            content: var(--placeholder-text);
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #2AE3F3;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        .keypad {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        /*noinspection CssUnusedSymbol*/
        .keypad.active {
            display: grid;
        }

        .key {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            background: #252d4a;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            color: #ffffff;
        }

        .key:hover {
            background: #303b5e;
            transform: scale(1.05);
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.special {
            background: #2AE3F3;
            color: #0d142d;
        }

        .key.special:hover {
            background: #23cbd9;
        }

        .key.delete {
            background: #e74c3c;
            color: white;
        }

        .key.delete:hover {
            background: #c0392b;
        }

        .key.nav {
            background: #4a5568;
            color: white;
        }

        .key.nav:hover {
            background: #2d3748;
        }

        .key.operator {
            background: #4a5568;
            color: #2AE3F3;
        }

        .key.operator:hover {
            background: #2d3748;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        #rollBtn {
            background: #2AE3F3;
            color: #0d142d;
        }

        #rollBtn:hover {
            background: #23cbd9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 227, 243, 0.4);
        }

        #clearBtn {
            background: #252d4a;
            color: #ffffff;
        }

        #clearBtn:hover {
            background: #303b5e;
        }

        .results {
            background: #0d142d;
            border-radius: 10px;
            padding: 5px;
            min-height: 100px;
        }

        .result-item {
            background: #1a2238;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #2AE3F3;
            animation:  slideIn 0.3s ease-out;
            color: #ffffff;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result-formula {
            font-weight: 600;
            color: #2AE3F3;
            margin-bottom: 8px;
        }

        /* Grid row: label + value side by side */
        .result-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-top: 5px;
        }

        /* Stacked row: label on top, content below (used for Rolls) */
        .result-row--stacked {
            flex-direction: column;
            align-items: stretch;
        }

        /* Fixed-width label column so values align across all rows */
        .result-lbl {
            color: #a0aec0;
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            min-width: 50px;
            flex-shrink: 0;
        }

        .result-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #ffffff;
        }

        .result-rolls {
            font-size: 1.2em;
            color: #2AE3F3;
            font-family: var(--mono-font), monospace;
            background: rgba(42, 227, 243, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 2px 6px;
        }

        .roll-chunk {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            padding: 2px 3px;
            /*background: rgba(0, 0, 0, 0.5);*/
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(42, 227, 243, 0.10);
            border-radius: 5px;
        }

        .result-range {
            font-size: 0.85em;
            color: #a0aec0;
        }

        /* Range label badges: (Limit) and (Abs) */
        .range-label {
            font-size: 0.85em;
            color: #718096;
            margin-left: 2px;
        }

        .result-math {
            font-size: 1em;
            color: #a0aec0;
            font-family: var(--mono-font), monospace;
        }

        /* Distributed die result: game result prominent, raw math subtle */
        .roll-val,
        .die-game {
            color: #2AE3F3;
            font-weight: 500;
            text-align: center;
        }

        .roll-val {
            flex-shrink: 0;
        }

        .die-game {
            display: inline-flex;
            align-items: baseline;
            padding: 2px 3px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(42, 227, 243, 0.10);
            border-radius: 5px;
            margin-right: 2px;
        }

        .die-game-val {
            display: inline-block;
            text-align: center;
        }

        /* Value was raised to floor limit: underline with offset, thicker and colored */
        .die-clamp-floor {
            font-style: normal;
            text-decoration-line: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            text-decoration-color: var(--clamp-floor);
        }

        /* Value was lowered to ceiling limit: overline, thicker and colored */
        .die-clamp-ceiling {
            font-style: normal;
            text-decoration-line: overline;
            text-decoration-thickness: 2px;
            text-decoration-color: var(--clamp-ceil);
        }

        /* Each die-cell keeps game-result + raw-math together when wrapping */
        .die-cell {
            display: inline-flex;
            align-items: baseline;
            white-space: nowrap;
        }

        /* Raw value within die-raw: right-aligned for digit-count consistency */
        .die-raw-val {
            display: inline-block;
            text-align: right;
        }

        .die-raw {
            color: #718096;
            font-size: 0.88em;
            margin-right: 4px;
        }

        .error {
            color: #ff8a80;
            text-align: center;
            padding: 10px;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid #e74c3c;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        body.force-keypad #diceInput {
            display: none !important;
        }

        body.force-keypad #dicePseudoInput {
            display: block !important;
        }

        body.force-keypad .keypad {
            display: grid !important;
        }

        body.force-keyboard #diceInput {
            display: block !important;
        }

        body.force-keyboard #dicePseudoInput {
            display: none !important;
        }

        body.force-keyboard .keypad {
            display: none !important;
        }

    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎲 Die! By the Browser</h1>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <div class="menu" id="menu">
        <div class="menu-item" data-mode="auto">
            <span class="menu-label">Auto (Responsive)</span>
            <span class="menu-check">✓</span>
        </div>
        <div class="menu-item" data-mode="keyboard">
            <span class="menu-label">External Keyboard</span>
            <span class="menu-check">✓</span>
        </div>
        <div class="menu-item" data-mode="keypad">
            <span class="menu-label">Onscreen Keypad</span>
            <span class="menu-check">✓</span>
        </div>
    </div>

    <div class="input-section">
        <input type="text" id="diceInput" autocomplete="off" aria-label="Dice notation input">
        <div id="dicePseudoInput" class="empty"></div>
    </div>

    <div class="keypad" id="keypad">
        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key special" data-value="d">d</button>
        <button class="key" data-value="0">0</button>
        <button class="key special" data-value=" ">␣</button>
        <button class="key operator" data-value="-">-</button>
        <button class="key operator" data-value="+">+</button>
        <button class="key operator" data-value="!">!</button>
        <button class="key nav" data-action="ArrowLeft">←</button>
        <button class="key delete" data-action="Backspace">⌫</button>
        <button class="key nav" data-action="ArrowRight">→</button>
    </div>

    <div class="button-group">
        <button id="rollBtn">Roll Dice</button>
        <button id="clearBtn">Clear</button>
    </div>

    <div class="results" id="results"></div>
</div>

<script>
  /**
   * Die! By the Browser | Copyright (C) 2026 Colin Kershaw
   * Licensed under GNU AGPLv3 (See file header for full notice).
   * A dice rolling application with keyboard and custom keypad support.
   */

  /**
   * DiceNotation - All dice notation business logic (pure, no DOM)
   * Handles parsing, validation, rolling, and error messages.
   *
   * Supported notation (PRD #1):
   *   NdX                   - basic roll
   *   NdX-M / NdX+M         - distributed modifier (applied to each die)
   *   NdX-M-F / NdX+M+C     - distributed modifier with floor/ceiling limit
   *   NdX -M / NdX +M       - aggregated modifier (applied to sum)
   *   NdX -M-F / NdX +M+C   - aggregated modifier with floor/ceiling limit
   *   B NdX[...]             - batch: roll the expression B times
   *   Multiple collections separated by spaces
   *
   * Symmetry Rule: the limit sign must match the modifier sign.
   */
  const DiceNotation = {
    /**
     * Parse dice notation string into structured collection data.
     * @param {string} input - Notation like "3d6 4d12" or "2 3d4-2-0"
     * @returns {Object} {collections: Array|null, error: string|null}
     */
    parse(input) {
      if (!input || typeof input !== 'string') return {collections: null, error: 'INVALID_FORMAT'};

      const trimmed = input.trim();
      if (!trimmed) return {collections: null, error: 'INVALID_FORMAT'};

      const tokens = trimmed.split(/\s+/);
      const collections = [];
      let i = 0;
      let totalCount = 0;

      // Token patterns
      const pureIntRe = /^\d+$/;
      const diceRe = /^(\d+)d(\d+)(([+-])(\d+)(([+-])(\d+))?)?$/i;
      const aggModRe = /^([+-])(\d+)(([+-])(\d+))?$/;

      while (i < tokens.length) {
        // Check for optional batch count (pure integer, no 'd')
        let batchCount = 1;
        if (pureIntRe.test(tokens[i])) {
          batchCount = parseInt(tokens[i], 10);
          i++;
          if (batchCount <= 0) return {collections: null, error: 'INVALID_FORMAT'};
          if (i >= tokens.length) return {collections: null, error: 'INVALID_FORMAT'};
        }

        // Parse dice token (may include attached distributed modifier+limit)
        const diceMatch = tokens[i].match(diceRe);
        if (!diceMatch) return {collections: null, error: 'INVALID_FORMAT'};

        const count = parseInt(diceMatch[1], 10);
        const sides = parseInt(diceMatch[2], 10);

        if (count <= 0 || sides <= 0) return {collections: null, error: 'INVALID_FORMAT'};
        if (count > DiceApp.MAX_DICE_COUNT) return {collections: null, error: 'TOO_MANY_DICE'};
        if (sides > DiceApp.MAX_DIE_SIDES) return {collections: null, error: 'TOO_MANY_SIDES'};

        totalCount += count * batchCount;
        if (totalCount > DiceApp.MAX_DICE_COUNT) return {collections: null, error: 'TOO_MANY_DICE'};

        let modifier = 0;
        let limit = null;
        let limitSign = null;
        let modifierMode = 'none';

        if (diceMatch[3]) {
          // Distributed modifier attached directly to dice token (no space)
          const modSign = diceMatch[4];
          modifier = parseInt(modSign + diceMatch[5], 10);
          modifierMode = 'distributed';
          if (Math.abs(modifier) > DiceApp.MAX_MODIFIER) return {collections: null, error: 'MODIFIER_TOO_LARGE'};
          if (diceMatch[6]) {
            const lim = DiceNotation._parseLimit(modSign, diceMatch[7], diceMatch[8]);
            if (lim.error) return {collections: null, error: lim.error};
            ({limit, limitSign} = lim);
            if (limit > DiceApp.MAX_MODIFIER) return {collections: null, error: 'MODIFIER_TOO_LARGE'};
          }
        }
        i++;

        // Check for space-separated aggregated modifier (only if no distributed modifier)
        if (i < tokens.length && modifierMode === 'none') {
          const aggMatch = tokens[i].match(aggModRe);
          if (aggMatch) {
            const modSign = aggMatch[1];
            modifier = parseInt(modSign + aggMatch[2], 10);
            modifierMode = 'aggregated';
            if (Math.abs(modifier) > DiceApp.MAX_MODIFIER) return {collections: null, error: 'MODIFIER_TOO_LARGE'};
            if (aggMatch[3]) {
              const lim = DiceNotation._parseLimit(modSign, aggMatch[4], aggMatch[5]);
              if (lim.error) return {collections: null, error: lim.error};
              ({limit, limitSign} = lim);
              if (limit > DiceApp.MAX_MODIFIER) return {collections: null, error: 'MODIFIER_TOO_LARGE'};
            }
            i++;
          }
        }

        collections.push({batchCount, count, sides, modifier, limit, limitSign, modifierMode});
      }

      return {collections: collections.length > 0 ? collections : null, error: null};
    },

    /**
     * Validate dice notation without rolling
     * @param {string} input
     * @returns {Object} {valid: boolean, error: string|null}
     */
    validate(input) {
      const {collections, error} = this.parse(input);
      return {valid: collections !== null, error};
    },

    /**
     * Parse and validate a limit token, enforcing the symmetry rule.
     * @param {string} modSign - '+' or '-' (the modifier's sign)
     * @param {string} limSign - '+' or '-' (the limit's sign)
     * @param {string} limitVal - Numeric string for the limit value
     * @returns {Object} {limit, limitSign} on success, or {error} on failure
     */
    _parseLimit(modSign, limSign, limitVal) {
      if (limSign !== modSign) return {error: 'INVALID_OPERATOR_FOR_LIMIT'};
      return {limit: parseInt(limitVal, 10), limitSign: limSign};
    },

    /**
     * Roll dice and return raw results
     * @param {number} count - Number of dice
     * @param {number} sides - Sides per die
     * @returns {Uint32Array} Individual roll results
     */
    roll(count, sides) {
      const rolls = new Uint32Array(count);
      for (let i = 0; i < count; i++) {
        rolls[i] = Math.floor(Math.random() * sides) + 1;
      }
      return rolls;
    },

    /**
     * Build a display formula string from parsed collection fields
     * @param {number} count
     * @param {number} sides
     * @param {number} modifier
     * @param {number|null} limit
     * @param {string|null} limitSign - '+' or '-'
     * @param {string} modifierMode - 'none'|'distributed'|'aggregated'
     * @returns {string}
     */
    buildFormula(count, sides, modifier, limit, limitSign, modifierMode) {
      let s = `${count}d${sides}`;
      if (modifierMode !== 'none') {
        const modStr = modifier >= 0 ? `+${modifier}` : `${modifier}`;
        s += modifierMode === 'aggregated' ? ` ${modStr}` : modStr;
        if (limit !== null) {
          s += `${limitSign}${limit}`;
        }
      }
      return s;
    },

    /**
     * Compute roll result with modifier/limit applied.
     * @param {Uint32Array} rawRolls - Raw die values
     * @param {Object} opts - {count, sides, modifier, limit, limitSign, modifierMode}
     * @returns {Object} Result object (mode-specific shape)
     */
    computeResult(rawRolls, {count, sides, modifier, limit, limitSign, modifierMode}) {
      const formula = DiceNotation.buildFormula(count, sides, modifier, limit, limitSign, modifierMode);

      if (modifierMode === 'none') {
        const rolls = Array.from(rawRolls);
        const total = rolls.reduce((s, v) => s + v, 0);
        return {formula, mode: 'none', rolls, total, min: count, max: count * sides, sides};
      }

      if (modifierMode === 'distributed') {
        const dieResults = Array.from(rawRolls).map(raw => {
          const modified = raw + modifier;
          let result = modified;
          let indicator = '';
          if (limit !== null) {
            if (limitSign === '-' && modified < limit) {
              result = limit;
              indicator = '*'; // raised to floor
            } else if (limitSign === '+' && modified > limit) {
              result = limit;
              indicator = '^'; // lowered to ceiling
            }
          }
          return {raw, result, indicator};
        });
        const total = dieResults.reduce((s, d) => s + d.result, 0);

        // Range: absolute span (no limit applied) and effective span (with limit)
        const rangeAbs = {min: count * (1 + modifier), max: count * (sides + modifier)};
        let rangeLimit = null;
        if (limit !== null) {
          if (limitSign === '-') {
            rangeLimit = {min: count * Math.max(limit, 1 + modifier), max: count * (sides + modifier)};
          } else {
            rangeLimit = {min: count * (1 + modifier), max: count * Math.min(limit, sides + modifier)};
          }
          // Discard rangeLimit when it doesn't actually constrain (equals rangeAbs)
          if (rangeLimit.min === rangeAbs.min && rangeLimit.max === rangeAbs.max) {
            rangeLimit = null;
          }
        }
        return {formula, mode: 'distributed', dieResults, total, modifier, rangeAbs, rangeLimit, sides, limit, limitSign};
      }

      // aggregated mode
      const rolls = Array.from(rawRolls);
      const rawSum = rolls.reduce((s, v) => s + v, 0);
      const modifiedSum = rawSum + modifier;
      let total = modifiedSum;
      let indicator = '';
      if (limit !== null) {
        if (limitSign === '-' && modifiedSum < limit) {
          total = limit;
          indicator = '*'; // raised to floor
        } else if (limitSign === '+' && modifiedSum > limit) {
          total = limit;
          indicator = '^'; // lowered to ceiling
        }
      }
      const rawMin = count;
      const rawMax = count * sides;
      const rangeAbs = {min: rawMin + modifier, max: rawMax + modifier};
      let rangeLimit = null;
      if (limit !== null) {
        if (limitSign === '-') {
          rangeLimit = {min: Math.max(limit, rawMin + modifier), max: rawMax + modifier};
        } else {
          rangeLimit = {min: rawMin + modifier, max: Math.min(limit, rawMax + modifier)};
        }
        // Discard rangeLimit when it doesn't actually constrain (equals rangeAbs)
        if (rangeLimit.min === rangeAbs.min && rangeLimit.max === rangeAbs.max) {
          rangeLimit = null;
        }
      }
      return {formula, mode: 'aggregated', rolls, rawSum, modifiedSum, total, indicator, modifier, rangeAbs, rangeLimit, sides};
    },

    /**
     * Get user-friendly error message
     * @param {string} errorCode
     * @returns {string}
     */
    getErrorMessage(errorCode) {
      const messages = {
        'INVALID_FORMAT': 'Invalid dice notation. Use format like "3d6 4d12"',
        'TOO_MANY_DICE': `Too many dice! Maximum allowed is ${DiceApp.MAX_DICE_COUNT.toLocaleString()}.`,
        'TOO_MANY_SIDES': `Too many sides! Maximum allowed is ${DiceApp.MAX_DIE_SIDES.toLocaleString()}.`,
        'INVALID_OPERATOR_FOR_LIMIT': 'Invalid operator for limit. Limit sign must match modifier sign (e.g., 3d6-5-1 or 3d6+5+10).',
        'MODIFIER_TOO_LARGE': `Modifier or limit too large! Maximum allowed is ${DiceApp.MAX_MODIFIER.toLocaleString()}.`
      };
      return messages[errorCode] || 'Unknown error';
    }
  };

  /**
   * DiceInput - Dual-mode input rendering and mode switching (UI only)
   * Handles keyboard and keypad display and interactions
   */
  const DiceInput = {
    keyboard: null,  // Reference to real <input>
    keypad: null,    // Reference to pseudo input div
    keypadButtons: null, // Reference to keypad container

    /**
     * Initialize with DOM nodes
     */
    init(keyboardNode, keypadNode, keypadButtonsNode) {
      this.keyboard = keyboardNode;
      this.keypad = keypadNode;
      this.keypadButtons = keypadButtonsNode;
    },

    /**
     * Switch to keyboard or keypad mode
     * @param {boolean} useKeypad
     */
    setMode(useKeypad) {
      document.body.classList.remove('force-keypad', 'force-keyboard');
      document.body.classList.add(useKeypad ? 'force-keypad' : 'force-keyboard');
      this.keyboard.disabled = useKeypad;
    },

    /**
     * Update display with value and cursor position
     * @param {string} value
     * @param {number} cursorPos
     * @param {boolean} isKeypadMode
     */
    setValue(value, cursorPos, isKeypadMode) {
      if (isKeypadMode) {
        this.updateKeypad(value, cursorPos);
      } else {
        this.updateKeyboard(value, cursorPos);
      }
    },

    /**
     * Update keyboard input
     */
    updateKeyboard(value, cursorPos) {
      // Only update the DOM value (and reposition cursor) when the value has
      // actually changed from an external source such as a URL-hash load or a
      // mode switch.  During normal typing the browser manages the cursor
      // natively, so we must not call setSelectionRange() or it will collapse
      // any selection the user is making (e.g. shift+click, shift+arrow).
      if (this.keyboard.value !== value) {
        this.keyboard.value = value;
        this.keyboard.setSelectionRange(cursorPos, cursorPos);
      }
    },

    /**
     * Update keypad pseudo input
     */
    updateKeypad(value, cursorPos) {
      if (value === '') {
        this.keypad.classList.add('empty');
        this.keypad.innerHTML = '';
      } else {
        this.keypad.classList.remove('empty');
        const before = value.slice(0, cursorPos);
        const after = value.slice(cursorPos);
        this.keypad.innerHTML = `${before}<span class="cursor"></span>${after}`;
      }
    },

    /**
     * Focus the active input
     * @param {boolean} isKeypadMode
     */
    focus(isKeypadMode) {
      if (!isKeypadMode) {
        this.keyboard.focus();
      }
    }
  };

  /**
   * DiceApp (Die! By the Browser) | Copyright (C) 2026 Colin Kershaw
   * Licensed under GNU AGPLv3 (See file header for full notice).
   * A dice rolling application with keyboard and keypad support.
   * Organized using the namespace pattern for clean separation of concerns.
   */
  const DiceApp = {
    // Configuration
    PLACEHOLDER_TEXT: "e.g., 3d6 2 3d4-2-0 4d6 +5+20",
    MAX_DICE_COUNT: 100000,
    MAX_DIE_SIDES: 1000000,
    MAX_MODIFIER: 1000000,

    // State management (Model)
    state: {
      currentValue: '',
      cursorPosition: 0,
      mode: 'auto', // 'auto', 'keyboard', or 'keypad'
      resolvedMode: null, // Actual mode after resolution: 'keyboard' or 'keypad'
      rollResults: [],
      errorMessage: ''
    },

    // DOM element cache
    nodes: {},

    // Utility functions (URL-specific, no dice logic)
    utils: {
      /**
       * Get query parameter from URL hash
       * @param {string} param - Parameter name
       * @returns {string|null}
       */
      getQueryParam(param) {
        const hash = window.location.hash.slice(1); // Remove #
        const params = new URLSearchParams(hash);
        return params.get(param);
      },

      /**
       * Update URL hash parameter (only if there's actual content)
       * @param {string} param - Parameter name
       * @param {string} value - Parameter value
       */
      setQueryParam(param, value) {
        const hash = window.location.hash.slice(1);
        const params = new URLSearchParams(hash);

        if (value) {
          params.set(param, value);
          window.location.hash = '#' + params.toString();
        } else {
          params.delete(param);
          const newHash = params.toString();
          // Only set hash if there are other params, otherwise remove it entirely
          if (newHash) {
            window.location.hash = '#' + newHash;
          } else {
            // Push a new "no-hash" state so Back/Forward history is preserved
            history.pushState(null, null, ' ');
          }

      }
    },

    // View (pure render functions, Model -> View only)
    ui: {

      /**
       * Check if device should use keypad mode (reads from Model only)
       * @returns {boolean}
       */
      isKeypadMode() {
        const {state} = DiceApp;
        return state.resolvedMode === 'keypad';
      },

      /**
       * Update the entire UI from Model
       */
      renderAll() {
        this.renderMode();
        this.renderResults();
        this.renderMenu();
      },

      /**
       * Render mode-specific layout
       */
      renderMode() {
        const {state} = DiceApp;
        const isKeypad = this.isKeypadMode();

        DiceInput.setMode(isKeypad);
        DiceInput.setValue(state.currentValue, state.cursorPosition, isKeypad);
      },

      /**
       * Render roll results and errors
       */
      renderResults() {
        const {nodes, state} = DiceApp;

        /**
         * Build a range string. Shows both Limit and Abs when a limit exists,
         * otherwise just the absolute range.
         * @param {{min,max}} rangeAbs
         * @param {{min,max}|null} rangeLimit
         * @returns {string}
         */
        const buildRangeStr = (rangeAbs, rangeLimit) => {
          if (rangeLimit) {
            return `${rangeLimit.min}–${rangeLimit.max} <span class="range-label">(Limit)</span>` +
              `&nbsp;&nbsp;${rangeAbs.min}–${rangeAbs.max} <span class="range-label">(Abs)</span>`;
          }
          return `${rangeAbs.min}–${rangeAbs.max}`;
        };

        /**
         * Build padded roll-value spans for basic/aggregated rolls.
         * Each roll is right-aligned to the theoretical max digit width for the die type.
         * @param {number[]} rolls
         * @param {number} sides
         * @returns {string}
         */
                    const rollValSpans = (rolls, sides) => {
              const w = String(sides).length;
              return rolls.map((v) =>
                `<span class="roll-chunk">` +
                `<span class="roll-val" style="min-width:${w}ch">${v}</span>` +
                `</span>`
              ).join('');
            };

        let newHTML = '';
        if (state.errorMessage) {
          newHTML = `<div class="error">${state.errorMessage}</div>`;
        } else {
          newHTML = state.rollResults.map(r => {
            /**
             * Render a game-result value with floor/ceiling visual decoration.
             * Model stores '*' (floor) and '^' (ceiling); View renders underline/overline.
             * No extra character is appended, so column width is purely digit-based.
             * @param {number} val - Displayed numeric value
             * @param {string} indicator - '' | '*' | '^'
             * @param {number} minWidth - ch width for alignment
             * @returns {string}
             */
            const gameSpan = (val, indicator, minWidth) => {
              const inner = `<span class="die-game-val" style="min-width:${minWidth}ch">${val}</span>`;
              if (indicator === '*') {
                return `<span class="die-game die-clamp-floor">${inner}</span>`;
              }
              if (indicator === '^') {
                return `<span class="die-game die-clamp-ceiling">${inner}</span>`;
              }
              return `<span class="die-game">${inner}</span>`;
            };

            if (r.mode === 'distributed') {
              const modStr = r.modifier >= 0 ? `+${r.modifier}` : `${r.modifier}`;

              // Theoretical max game-result width (digits only — indicator is now text-decoration).
              // A floor limit (-) is the true minimum displayed value (result ≥ limit by definition).
              // A ceiling limit (+) is the true maximum displayed value (result ≤ limit by definition).
              const theorMinGame = r.limit !== null && r.limitSign === '-' ? r.limit : 1 + r.modifier;
              const theorMaxGame = r.limit !== null && r.limitSign === '+' ? r.limit : r.sides + r.modifier;
              const maxGameWidth = Math.max(String(theorMinGame).length, String(theorMaxGame).length);
              // Theoretical max raw-value width (always 1..sides)
              const maxRawWidth = String(r.sides).length;

              const rollsDisplay = r.dieResults.map(d =>
                `<span class="die-cell" role="group" aria-label="die: ${d.result}${d.indicator} (raw: ${d.raw})">` +
                gameSpan(d.result, d.indicator, maxGameWidth) +
                `<span class="die-raw">=[<span class="die-raw-val" style="min-width:${maxRawWidth}ch">${d.raw}</span>${modStr}]</span>` +
                `</span>`
              ).join('');
              const rangeStr = buildRangeStr(r.rangeAbs, r.rangeLimit);
              return `
        <div class="result-item">
          <div class="result-formula">${r.formula}</div>
          <div class="result-row"><span class="result-lbl">Total:</span><span class="result-value">${r.total}</span></div>
          <div class="result-row result-row--stacked"><span class="result-lbl">Rolls:</span><span class="result-rolls">${rollsDisplay}</span></div>
          <div class="result-row"><span class="result-lbl">Range:</span><span class="result-range">${rangeStr}</span></div>
        </div>
      `;
            } else if (r.mode === 'aggregated') {
              const decoratedTotal = r.indicator === '*'
                ? `<span class="die-clamp-floor">${r.total}</span>`
                : r.indicator === '^'
                  ? `<span class="die-clamp-ceiling">${r.total}</span>`
                  : `${r.total}`;
              const mathStr = r.modifier >= 0
                ? `(${r.rawSum}) + ${r.modifier} = ${decoratedTotal}`
                : `(${r.rawSum}) - ${Math.abs(r.modifier)} = ${decoratedTotal}`;
              const rangeStr = buildRangeStr(r.rangeAbs, r.rangeLimit);
              return `
        <div class="result-item">
          <div class="result-formula">${r.formula}</div>
          <div class="result-row"><span class="result-lbl">Total:</span><span class="result-value">${decoratedTotal}</span></div>
          <div class="result-row"><span class="result-lbl">Math:</span><span class="result-math">${mathStr}</span></div>
          <div class="result-row result-row--stacked"><span class="result-lbl">Rolls:</span><span class="result-rolls">${rollValSpans(r.rolls, r.sides)}</span></div>
          <div class="result-row"><span class="result-lbl">Range:</span><span class="result-range">${rangeStr}</span></div>
        </div>
      `;
            } else {
              // mode === 'none' (basic roll, no modifier)
              return `
        <div class="result-item">
          <div class="result-formula">${r.formula}</div>
          <div class="result-row"><span class="result-lbl">Total:</span><span class="result-value">${r.total}</span></div>
          <div class="result-row result-row--stacked"><span class="result-lbl">Rolls:</span><span class="result-rolls">${rollValSpans(r.rolls, r.sides)}</span></div>
          <div class="result-row"><span class="result-lbl">Range:</span><span class="result-range">${r.min}–${r.max}</span></div>
        </div>
      `;
            }
          }).join('');
        }

        // Only update DOM if content has changed to avoid "jumping" on every keystroke
        if (nodes.results.innerHTML !== newHTML) {
          nodes.results.innerHTML = newHTML;
        }
      },

      /**
       * Render menu to show current mode
       */
      renderMenu() {
        const {state, nodes} = DiceApp;
        if (!nodes.menu) return;

        const menuItems = nodes.menu.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
          const mode = item.dataset.mode;
          const check = item.querySelector('.menu-check');

          if (mode === state.mode) {
            item.classList.add('active');
            if (check) check.style.display = 'block';
          } else {
            item.classList.remove('active');
            if (check) check.style.display = 'none';
          }
        });
      },

      /**
       * Toggle menu visibility
       */
      toggleMenu() {
        DiceApp.nodes.menu.classList.toggle('active');
      },

      /**
       * Close menu
       */
      closeMenu() {
        DiceApp.nodes.menu.classList.remove('active');
      }
    },

    // Controller (mediates all input, updates Model, then calls View)
    actions: {
      /**
       * Update current value and cursor from external source (like keyboard input or hash)
       * @param {string} val
       * @param {number} pos
       */
      updateInput(val, pos) {
        const {state, ui} = DiceApp;
        state.currentValue = val;
        state.cursorPosition = (pos !== undefined) ? pos : val.length;
        ui.renderAll();
      },

      /**
       * Perform dice roll and display results
       */
      roll() {
        const {state, utils, ui} = DiceApp;
        const notation = state.currentValue;
        const {collections: parsed, error} = DiceNotation.parse(notation);

        if (!parsed) {
          state.errorMessage = DiceNotation.getErrorMessage(error);
          state.rollResults = [];
          ui.renderAll();
          return;
        }

        state.errorMessage = '';
        state.rollResults = [];

        for (const coll of parsed) {
          const {batchCount, count, sides, modifier, limit, limitSign, modifierMode} = coll;
          for (let b = 0; b < batchCount; b++) {
            const rawRolls = DiceNotation.roll(count, sides);
            const result = DiceNotation.computeResult(rawRolls, {count, sides, modifier, limit, limitSign, modifierMode});
            state.rollResults.push(result);
          }
        }

        utils.setQueryParam('dice', notation);
        ui.renderAll();
      },

      /**
       * Clear all inputs and results
       */
      clear() {
        const {state, utils, ui} = DiceApp;
        state.currentValue = '';
        state.cursorPosition = 0;
        state.rollResults = [];
        state.errorMessage = '';

        // Use setTimeout to ensure DOM updates before hash changes
        setTimeout(() => {
          utils.setQueryParam('dice', '');
        }, 0);

        ui.renderAll();
        DiceInput.focus(ui.isKeypadMode());
      },

      /**
       * Set display mode
       * @param {string} mode - 'auto', 'keyboard', or 'keypad'
       */
      setMode(mode) {
        const {state, actions, ui} = DiceApp;
        state.mode = mode;
        actions.detectInputMode();
        ui.renderAll();
        DiceInput.focus(ui.isKeypadMode()); // Ensure the active input is focused after switch
        ui.closeMenu();
      },

      /**
       * Detect and set the resolved input mode based on device characteristics
       * This is the single source of truth for mode resolution (Controller layer)
       */
      detectInputMode() {
        const {state} = DiceApp;

        if (state.mode === 'keyboard') {
          state.resolvedMode = 'keyboard';
        } else if (state.mode === 'keypad') {
          state.resolvedMode = 'keypad';
        } else {
          // mode === 'auto' - detect based on device
          const width = window.innerWidth;
          const mobile = width <= 767;
          const tablet = width >= 768 && width <= 1023;
          const hasCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

          if (mobile) {
            state.resolvedMode = 'keypad';
          } else if (tablet && hasCoarsePointer) {
            state.resolvedMode = 'keypad';
          } else {
            state.resolvedMode = 'keyboard';
          }
        }
      }
    },

    // Event handlers
    handlers: {
      /**
       * Handle desktop input events
       * @param {Event} e
       */
      onInput(e) {
        DiceApp.actions.updateInput(e.target.value, e.target.selectionStart);
      },

      /**
       * Insert a character at the current cursor position
       * @param {string} char
       */
      insertAtCursor(char) {
        const {state, ui} = DiceApp;
        state.currentValue = state.currentValue.slice(0, state.cursorPosition) +
          char +
          state.currentValue.slice(state.cursorPosition);
        state.cursorPosition++;
        ui.renderAll();
      },

      /**
       * Delete character before the current cursor position
       */
      deleteAtCursor() {
        const {state, ui} = DiceApp;
        if (state.cursorPosition > 0) {
          state.currentValue = state.currentValue.slice(0, state.cursorPosition - 1) +
            state.currentValue.slice(state.cursorPosition);
          state.cursorPosition--;
          ui.renderAll();
        }
      },

      /**
       * Move cursor by delta
       * @param {number} delta
       */
      moveCursor(delta) {
        const {state, ui} = DiceApp;
        const newPos = state.cursorPosition + delta;
        if (newPos >= 0 && newPos <= state.currentValue.length) {
          state.cursorPosition = newPos;
          ui.renderAll();
        }
      },

      /**
       * A mapping of keys to their respective handler functions
       * Initialized with static keys; numbers added dynamically
       */
      keyMap: {},

      /**
       * Initialize keyMap with all key mappings
       */
      initializeKeyMap() {
        // Static key mappings
        this.keyMap['Backspace'] = () => DiceApp.handlers.deleteAtCursor();
        this.keyMap['ArrowLeft'] = () => DiceApp.handlers.moveCursor(-1);
        this.keyMap['ArrowRight'] = () => DiceApp.handlers.moveCursor(1);
        this.keyMap[' '] = () => DiceApp.handlers.insertAtCursor(' ');
        this.keyMap['d'] = () => DiceApp.handlers.insertAtCursor('d');
        this.keyMap['D'] = () => DiceApp.handlers.insertAtCursor('d');
        this.keyMap['-'] = () => DiceApp.handlers.insertAtCursor('-');
        this.keyMap['+'] = () => DiceApp.handlers.insertAtCursor('+');
        this.keyMap['!'] = () => DiceApp.handlers.insertAtCursor('!');

        // Dynamic number key mappings (0-9)
        for (let i = 0; i <= 9; i++) {
          const digit = i.toString();
          this.keyMap[digit] = () => DiceApp.handlers.insertAtCursor(digit);
        }
      },

      /**
       * Handle keypad button clicks
       */
      onKeypadClick(e) {
        if (!e.target.classList.contains('key')) return;

        const {action, value} = e.target.dataset;

        // Check if action maps to a key in keyMap
        if (action && this.keyMap[action]) {
          this.keyMap[action]();
        } else if (value !== undefined) {
          this.insertAtCursor(value);
        }
      },

      /**
       * Handle keyboard input globally (works in both modes)
       */
      onKeyDownGlobal(e) {
        const {ui, actions} = DiceApp;

        // Global shortcuts (work in both modes)
        if (e.key === 'Escape') {
          actions.clear();
          return;
        }

        if (e.key === 'Enter') {
          actions.roll();
          return;
        }

        // Keypad mode keyboard support
        if (ui.isKeypadMode()) {
          // Don't intercept browser shortcuts (Alt+D, Ctrl+L, etc.)
          if (e.altKey || e.ctrlKey || e.metaKey) return;

          // Check if key is mapped
          const mapped = this.keyMap[e.key];
          if (mapped) {
            e.preventDefault();
            mapped();
          }
        }
      },

      /**
       * Handle menu item clicks
       */
      onMenuClick(e) {
        const menuItem = e.target.closest('.menu-item');
        if (!menuItem) return;

        const mode = menuItem.dataset.mode;
        DiceApp.actions.setMode(mode);
      },

      /**
       * Close menu when clicking outside
       */
      onDocumentClick(e) {
        const {nodes} = DiceApp;
        if (!nodes.menu.contains(e.target) &&
          !nodes.hamburger.contains(e.target) &&
          nodes.menu.classList.contains('active')) {
          DiceApp.ui.closeMenu();
        }
      }
    },

    // Test suite
    tests: {
      /**
       * Run all tests and log results
       * @returns {Promise<boolean>} True if all tests pass
       */
      async run() {
        const testCases = [
          {
            name: "Parse single dice roll",
            test: () => {
              const result = DiceNotation.parse("3d6");
              const c = result.collections;
              return c !== null && c.length === 1 &&
                c[0].count === 3 && c[0].sides === 6 &&
                c[0].batchCount === 1 && c[0].modifierMode === 'none';
            }
          },
          {
            name: "Parse multiple dice rolls",
            test: () => {
              const result = DiceNotation.parse("3d6 4d12");
              const c = result.collections;
              return c !== null && c.length === 2 &&
                c[0].count === 3 && c[0].sides === 6 &&
                c[1].count === 4 && c[1].sides === 12;
            }
          },
          {
            name: "Parse with extra spaces",
            test: () => {
              const result = DiceNotation.parse("3d6  4d12");
              const c = result.collections;
              return c !== null && c.length === 2 &&
                c[0].count === 3 && c[0].sides === 6 &&
                c[1].count === 4 && c[1].sides === 12;
            }
          },
          {
            name: "Handle single die",
            test: () => {
              const result = DiceNotation.parse("1d20");
              const c = result.collections;
              return c !== null && c.length === 1 &&
                c[0].count === 1 && c[0].sides === 20;
            }
          },
          {
            name: "Handle large numbers",
            test: () => {
              const result = DiceNotation.parse("10d100");
              const c = result.collections;
              return c !== null && c.length === 1 &&
                c[0].count === 10 && c[0].sides === 100;
            }
          },
          {
            name: "Reject invalid format - missing d",
            test: () => {
              const result = DiceNotation.parse("3-6");
              return result.collections === null;
            }
          },
          {
            name: "Reject invalid format - letters",
            test: () => {
              const result = DiceNotation.parse("3dx");
              return result.collections === null;
            }
          },
          {
            name: "Reject zero dice",
            test: () => {
              const result = DiceNotation.parse("0d6");
              return result.collections === null;
            }
          },
          {
            name: "Reject zero-sided die",
            test: () => {
              const result = DiceNotation.parse("3d0");
              return result.collections === null;
            }
          },

          },
          {
            name: "Keypad click - ArrowRight action",
            test: () => {
              DiceApp.state.currentValue = '3d6';
              DiceApp.state.cursorPosition = 0;
              const fakeEvent = {
                target: {
                  classList: {contains: () => true},
                  dataset: {action: 'ArrowRight'}
                }
              };
              DiceApp.handlers.onKeypadClick(fakeEvent);
              return DiceApp.state.cursorPosition === 1;
            }
          },
          {
            name: "Keypad click ignores non-key elements",
            test: () => {
              DiceApp.state.currentValue = '3d6';
              DiceApp.state.cursorPosition = 3;
              const fakeEvent = {
                target: {
                  classList: {contains: () => false},
                  dataset: {value: '9'}
                }
              };
              DiceApp.handlers.onKeypadClick(fakeEvent);
              // Should not change anything
              return DiceApp.state.currentValue === '3d6' && DiceApp.state.cursorPosition === 3;
            }
          },
          {
            name: "Keyboard event in keypad mode - digit",
            test: () => {
              DiceApp.actions.setMode('keypad');
              DiceApp.state.currentValue = '';
              DiceApp.state.cursorPosition = 0;
              const fakeEvent = {
                key: '4',
                altKey: false,
                ctrlKey: false,
                metaKey: false,
                preventDefault: () => {
                }
              };
              DiceApp.handlers.onKeyDownGlobal(fakeEvent);
              return DiceApp.state.currentValue === '4' && DiceApp.state.cursorPosition === 1;
            }
          },
          {
            name: "Keyboard event ignores browser shortcuts in keypad mode",
            test: () => {
              DiceApp.actions.setMode('keypad');
              DiceApp.state.currentValue = '';
              DiceApp.state.cursorPosition = 0;
              const fakeEvent = {
                key: 'd',
                altKey: true,
                ctrlKey: false,
                metaKey: false,
                preventDefault: () => {
                }
              };
              DiceApp.handlers.onKeyDownGlobal(fakeEvent);
              // Should not insert 'd' because Alt is pressed
              return DiceApp.state.currentValue === '' && DiceApp.state.cursorPosition === 0;
            }
          },
          {
            name: "Auto mode applies force-keypad class on mobile width",
            test: () => {
              const originalWidth = window.innerWidth;
              Object.defineProperty(window, 'innerWidth', {writable: true, configurable: true, value: 400});
              DiceApp.actions.setMode('auto');
              Object.defineProperty(window, 'innerWidth', {writable: true, configurable: true, value: originalWidth});
              return document.body.classList.contains('force-keypad') &&
                !document.body.classList.contains('force-keyboard') &&
                DiceApp.nodes.input.disabled === true;
            }
          },
          {
            name: "Auto mode applies force-keyboard class on desktop width",
            test: () => {
              const originalWidth = window.innerWidth;
              Object.defineProperty(window, 'innerWidth', {writable: true, configurable: true, value: 1200});
              DiceApp.actions.setMode('auto');
              Object.defineProperty(window, 'innerWidth', {writable: true, configurable: true, value: originalWidth});
              return document.body.classList.contains('force-keyboard') &&
                !document.body.classList.contains('force-keypad') &&
                DiceApp.nodes.input.disabled === false;
            }
          },
          {
            name: "Real input is disabled in keypad mode",
            test: () => {
              DiceApp.actions.setMode('keypad');
              return DiceApp.nodes.input.disabled === true &&
                document.body.classList.contains('force-keypad');
            }
          },
          {
            name: "Real input is enabled in keyboard mode",
            test: () => {
              DiceApp.actions.setMode('keyboard');
              return DiceApp.nodes.input.disabled === false &&
                document.body.classList.contains('force-keyboard');
            }
          },
          {
            name: "Cursor position preserved when switching from keypad to keyboard",
            test: () => {
              DiceApp.actions.setMode('keypad');
              DiceApp.state.currentValue = '3d6';
              DiceApp.state.cursorPosition = 2;
              DiceApp.ui.renderAll();
              DiceApp.actions.setMode('keyboard');
              return DiceApp.nodes.input.selectionStart === 2 &&
                DiceApp.nodes.input.selectionEnd === 2;
            }
          },
          {
            name: "Input value synced from model in keyboard mode",
            test: () => {
              DiceApp.state.currentValue = '2d8';
              DiceApp.actions.setMode('keyboard');
              return DiceApp.nodes.input.value === '2d8';
            }
          },
          {
            name: "Pseudo input synced from model in keypad mode",
            test: () => {
              DiceApp.state.currentValue = '4d10';
              DiceApp.state.cursorPosition = 4;
              DiceApp.actions.setMode('keypad');
              return DiceApp.nodes.display.innerHTML.includes('4d10');
            }
          }
        ];

        let passed = 0;
        let failed = 0;

        console.log('🎲 Running DiceApp Tests...\n');

        for (const testCase of testCases) {
          // SAVE STATE before each test (deep copy where needed)
          const savedState = {
            currentValue: DiceApp.state.currentValue,
            cursorPosition: DiceApp.state.cursorPosition,
            mode: DiceApp.state.mode,
            inputValue: DiceApp.nodes.input.value,
            displayHTML: DiceApp.nodes.display.innerHTML,
            displayClasses: DiceApp.nodes.display.className,
            resultsHTML: DiceApp.nodes.results.innerHTML,
            hash: window.location.hash,
            bodyClasses: document.body.className
          };

          try {
            let result, match;

            // All tests now use custom test function (might be async)
            if (testCase.async) {
              result = await testCase.test();
            } else {
              result = testCase.test();
            }
            match = result === true;

            if (match) {
              passed++;
              console.log(`✓ ${testCase.name}`);
            } else {
              failed++;
              console.error(`✗ ${testCase.name}`);
              console.error(`  Test returned: ${result}`);
            }
          } catch (e) {
            failed++;
            console.error(`✗ ${testCase.name} - Exception: ${e.message}`);
          } finally {
            // RESTORE STATE after each test - be thorough
            DiceApp.state.currentValue = savedState.currentValue;
            DiceApp.state.cursorPosition = savedState.cursorPosition;
            DiceApp.state.mode = savedState.mode;
            DiceApp.state.rollResults = [];
            DiceApp.state.errorMessage = '';
            DiceApp.nodes.input.value = savedState.inputValue;
            DiceApp.nodes.display.innerHTML = savedState.displayHTML;
            DiceApp.nodes.display.className = savedState.displayClasses;
            DiceApp.nodes.results.innerHTML = savedState.resultsHTML;
            document.body.className = savedState.bodyClasses;

            // Restore hash carefully
            if (window.location.hash !== savedState.hash) {
              if (savedState.hash) {
                window.location.hash = savedState.hash;
              } else if (!savedState.currentValue) {
                // Only clear hash if there was no content originally
                history.replaceState(null, null, ' ');
              }
            }

            // Force UI refresh to match restored state
            DiceApp.ui.renderAll();
          }
        }

        console.log(`\n📊 Tests: ${passed} passed, ${failed} failed`);
        return failed === 0;
      }
    },

    // Setup and Initialization
    setup: {
      init() {
        this.cacheDomElements();
        DiceInput.init(
          DiceApp.nodes.input,
          DiceApp.nodes.display,
          DiceApp.nodes.keypad
        );
        this.setPlaceholderText();
        this.loadInitialConfig();
        DiceApp.actions.detectInputMode();
        DiceApp.handlers.initializeKeyMap();
        this.bindEvents();
        this.initializeUI();

        console.log('🎲 DiceApp initialized successfully!');
        console.log('💡 To run tests, call: DiceApp.tests.run()');
      },

      cacheDomElements() {
        DiceApp.nodes = {
          input: document.getElementById('diceInput'),
          display: document.getElementById('dicePseudoInput'),
          keypad: document.getElementById('keypad'),
          rollBtn: document.getElementById('rollBtn'),
          clearBtn: document.getElementById('clearBtn'),
          results: document.getElementById('results'),
          hamburger: document.getElementById('hamburger'),
          menu: document.getElementById('menu')
        };
      },

      setPlaceholderText() {
        document.documentElement.style.setProperty('--placeholder-text', `"${DiceApp.PLACEHOLDER_TEXT}"`);
        DiceApp.nodes.input.placeholder = DiceApp.PLACEHOLDER_TEXT;
      },

      loadInitialConfig() {
        const diceFromUrl = DiceApp.utils.getQueryParam('dice');
        if (diceFromUrl) {
          DiceApp.state.currentValue = diceFromUrl;
          DiceApp.state.cursorPosition = diceFromUrl.length;
        }
      },

      bindEvents() {
        DiceApp.nodes.input.addEventListener('input', (e) => DiceApp.handlers.onInput(e));
        DiceApp.nodes.input.addEventListener('keyup', (e) => DiceApp.handlers.onInput(e));
        DiceApp.nodes.input.addEventListener('click', (e) => DiceApp.handlers.onInput(e));
        DiceApp.nodes.keypad.addEventListener('click', (e) => DiceApp.handlers.onKeypadClick(e));
        DiceApp.nodes.rollBtn.addEventListener('click', () => DiceApp.actions.roll());
        DiceApp.nodes.clearBtn.addEventListener('click', () => DiceApp.actions.clear());
        DiceApp.nodes.hamburger.addEventListener('click', () => DiceApp.ui.toggleMenu());
        DiceApp.nodes.menu.addEventListener('click', (e) => DiceApp.handlers.onMenuClick(e));
        window.addEventListener('keydown', (e) => DiceApp.handlers.onKeyDownGlobal(e));
        window.addEventListener('resize', () => {
          DiceApp.actions.detectInputMode();
          DiceApp.ui.renderAll();
          // Restore focus after auto-mode switch (keyboard ↔ keypad)
          DiceInput.focus(DiceApp.ui.isKeypadMode());
        });
        document.addEventListener('click', (e) => DiceApp.handlers.onDocumentClick(e));

        window.addEventListener('hashchange', () => {
          const diceConfig = DiceApp.utils.getQueryParam('dice') || '';
          if (diceConfig !== DiceApp.state.currentValue) {
            DiceApp.actions.updateInput(diceConfig);
          }
        });
      },

      initializeUI() {
        DiceApp.ui.renderAll();
        DiceInput.focus(DiceApp.ui.isKeypadMode());
      }
    }
  };

  // Start the application
  DiceApp.setup.init();

</script>
</body>
</html>
